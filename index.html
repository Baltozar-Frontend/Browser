<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        button { background: #3390ec; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Подтвердите вход</h2>
        <p>Нажмите кнопку, чтобы активировать аккаунт.</p>
        <button id="authBtn">Подтвердить</button>
        <div id="result" style="margin-top: 10px; font-size: 12px; word-break: break-all; color: #555;"></div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        const btn = document.getElementById('authBtn');
        const result = document.getElementById('result');

        btn.onclick = () => {
            btn.disabled = true;
            btn.innerText = "Загрузка...";
            
            // Отправляем данные боту
            tg.sendData(tg.initData); 
            // initData содержит query_id, user, auth_date и hash
            
            result.innerText = tg.initData;
            
            // Для удобства копирования (если бот не получит данные)
            setTimeout(() => {
                navigator.clipboard.writeText(tg.initData);
                result.innerText += "\n\nСкопировано в буфер обмена!";
            }, 1000);
        };
    </script>
</body>
</html>
