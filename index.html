<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Надежный Чат</title>
    <!-- Иконки и библиотека PeerJS для прямого P2P соединения -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"P2P Чат","short_name":"P2P","start_url":".","display":"standalone","background_color":"#0e1621","theme_color":"#17212b","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2525/2525779.png","sizes":"512x512","type":"image/png"}]}'>
</head>
<body>

<div class="app-container">
    <!-- Сайдбар (Контакты) -->
    <aside class="sidebar">
        <div class="header">
            <h3>Контакты</h3>
            <button onclick="connectToPeer()" title="Подключиться к другу"><i class="fas fa-user-plus"></i></button>
        </div>
        <div class="contacts-list" id="contactsList">
            <!-- Сюда будут падать активные диалоги -->
        </div>
        <div class="user-profile">
            <div class="profile-meta">
                <span class="user-label">Ваш Ник: <b id="myNickDisplay">Юзер</b> <i class="fas fa-edit edit-nick" onclick="changeNickname()"></i></span>
                <span class="user-id-text" onclick="copyMyId()" title="Кликни, чтобы скопировать">
                    ID: <span id="myIdDisplay">Генерация...</span> <i class="far fa-copy"></i>
                </span>
            </div>
        </div>
    </aside>

    <!-- Чат -->
    <main class="chat-area">
        <div class="chat-header">
            <div class="chat-info">
                <h3 id="chatTitle">Выберите собеседника</h3>
                <p id="chatStatus">Статус: нет соединения</p>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="welcome-msg">
                <i class="fas fa-shield-alt" style="font-size: 3rem; color: var(--accent); margin-bottom: 15px;"></i>
                <br>
                <b>Это полностью прямой P2P-мессенджер.</b><br><br>
                1. Скопируйте ваш ID в левом нижнем углу и отправьте другу.<br>
                2. Или нажмите на плюс сверху и введите ID друга.<br>
                Сообщения идут напрямую между устройствами.
            </div>
        </div>

        <form class="input-area" onsubmit="sendMessage(event)">
            <input type="text" id="messageInput" placeholder="Напишите сообщение..." autocomplete="off" disabled>
            <button type="submit" id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
        </form>
    </main>
</div>

<style>
    :root {
        --bg-main: #0e1621;
        --bg-sidebar: #17212b;
        --bg-chat: #182533;
        --text-color: #f5f5f5;
        --text-muted: #7f91a4;
        --accent: #2481cc;
        --accent-hover: #2f93de;
        --msg-out: #2b5278;
        --msg-in: #182533;
        --border: #101924;
        --status-online: #4ade80;
        --status-offline: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-color); height: 100vh; overflow: hidden; }
    .app-container { display: flex; height: 100vh; width: 100vw; }

    /* Сайдбар */
    .sidebar { width: 300px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .header button { background: var(--accent); border: none; color: white; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; transition: 0.2s; }
    .header button:hover { background: var(--accent-hover); }
    
    .contacts-list { flex: 1; overflow-y: auto; }
    .contact-item { padding: 15px 20px; display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid var(--border); gap: 12px; }
    .contact-item:hover, .contact-item.active { background: #202b36; }
    .contact-avatar { width: 40px; height: 40px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .contact-info { flex: 1; }
    .contact-info h4 { font-size: 0.95rem; font-weight: 500; }
    .contact-info p { font-size: 0.8rem; color: var(--text-muted); }

    .user-profile { padding: 15px 20px; border-top: 1px solid var(--border); background: #111921; }
    .profile-meta { display: flex; flex-direction: column; gap: 5px; }
    .user-label { font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
    .edit-nick { cursor: pointer; color: var(--text-muted); }
    .edit-nick:hover { color: white; }
    .user-id-text { font-size: 0.75rem; color: var(--text-muted); cursor: pointer; background: #182533; padding: 6px; border-radius: 4px; border: 1px solid var(--border); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-id-text:hover { color: white; background: #1c2a3a; }

    /* Чат */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
    .chat-header { padding: 15px 20px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); }
    .chat-info h3 { font-size: 1.05rem; }
    .chat-info p { font-size: 0.8rem; color: var(--text-muted); }

    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .welcome-msg { text-align: center; color: var(--text-muted); margin: auto; max-width: 400px; line-height: 1.5; }
    
    .msg { max-width: 65%; padding: 10px 14px; border-radius: 12px; position: relative; animation: fadeIn 0.15s ease; word-break: break-word; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg.incoming { background: var(--msg-in); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .msg.outgoing { background: var(--msg-out); align-self: flex-end; border-bottom-right-radius: 4px; }
    
    .msg .text { font-size: 0.95rem; }
    .msg .meta-box { display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 4px; }
    .msg .time { font-size: 0.65rem; color: var(--text-muted); }
    .msg .status-icon { font-size: 0.65rem; color: #4ade80; }

    .input-area { padding: 15px 20px; background: var(--bg-sidebar); display: flex; gap: 10px; }
    .input-area input { flex: 1; background: var(--bg-main); border: 1px solid var(--border); padding: 12px 15px; border-radius: 8px; color: white; font-size: 1rem; outline: none; }
    .input-area input:focus { border-color: var(--accent); }
    .input-area button { background: var(--accent); border: none; color: white; width: 45px; height: 45px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .input-area button:disabled { background: #202b36; color: var(--text-muted); cursor: not-allowed; }

    @media (max-width: 600px) {
        .app-container { flex-direction: column; }
        .sidebar { width: 100%; height: 40%; }
        .chat-area { height: 60%; }
    }
</style>

<script>
    let peer = null;
    let connections = {}; // Хранилище активных P2P соединений
    let activePeerId = null;
    let myNickname = localStorage.getItem('p2p_nick') || 'Бро_' + Math.floor(Math.random() * 100);
    let chatHistory = JSON.parse(localStorage.getItem('p2p_history')) || {};

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('myNickDisplay').innerText = myNickname;
        initPeer();
    });

    // Инициализация P2P узла
    function initPeer() {
        // Создаем случайный короткий ID для удобства передачи
        const customId = 'tgx-' + Math.random().toString(36).substring(2, 10);
        peer = new Peer(customId);

        peer.on('open', (id) => {
            document.getElementById('myIdDisplay').innerText = id;
            renderContacts();
        });

        // Слушаем входящие подключения от друзей
        peer.on('connection', (conn) => {
            setupConnectionHandlers(conn);
        });

        peer.on('error', (err) => {
            console.error('Ошибка Сети P2P:', err);
            alert('Ошибка сети: ' + err.type);
        });
    }

    // Подключение к другу по его ID
    function connectToPeer() {
        const targetId = prompt("Введите P2P ID вашего друга:");
        if (!targetId || targetId.trim() === "") return;
        const cleanId = targetId.trim();

        if (connections[cleanId]) {
            selectContact(cleanId);
            return;
        }

        // Инициируем прямое подключение
        const conn = peer.connect(cleanId, {
            metadata: { nickname: myNickname },
            reliable: true // Включает гарантированную доставку пакетов
        });
        
        setupConnectionHandlers(conn);
    }

    // Настройка обработчиков событий для конкретного соединения
    function setupConnectionHandlers(conn) {
        conn.on('open', () => {
            connections[conn.peer] = conn;
            
            // Если друг передал свой ник в метаданных, запишем его
            const friendNick = conn.metadata?.nickname || 'Друг';
            if (!chatHistory[conn.peer]) {
                chatHistory[conn.peer] = { nickname: friendNick, messages: [] };
            } else {
                chatHistory[conn.peer].nickname = friendNick;
            }

            // Отправляем свой ник в ответ, чтобы у него обновилось имя
            conn.send({ type: 'SYSTEM_NICK', nickname: myNickname });

            saveHistory();
            renderContacts();
            selectContact(conn.peer);
        });

        // Прилетели данные от друга
        conn.on('data', (data) => {
            if (data.type === 'SYSTEM_NICK') {
                if (chatHistory[conn.peer]) {
                    chatHistory[conn.peer].nickname = data.nickname;
                    renderContacts();
                    if(activePeerId === conn.peer) {
                        document.getElementById('chatTitle').innerText = data.nickname;
                    }
                }
                return;
            }

            if (data.type === 'TEXT') {
                if (!chatHistory[conn.peer]) {
                    chatHistory[conn.peer] = { nickname: 'Друг', messages: [] };
                }
                
                const newMsg = {
                    id: data.id,
                    sender: 'incoming',
                    text: data.text,
                    time: data.time
                };
                
                chatHistory[conn.peer].messages.push(newMsg);
                saveHistory();

                // Отправляем сигнал подтверждения: "Я получил сообщение!"
                conn.send({ type: 'ACK', id: data.id });

                if (activePeerId === conn.peer) {
                    appendMessage(newMsg);
                } else {
                    renderContacts(); // Чтобы обновить последнее сообщение в списке
                }
            }

            // Пришло подтверждение доставки (ACK)
            if (data.type === 'ACK') {
                if (chatHistory[conn.peer]) {
                    const msg = chatHistory[conn.peer].messages.find(m => m.id === data.id);
                    if (msg) {
                        msg.delivered = true;
                        saveHistory();
                        if (activePeerId === conn.peer) {
                            renderMessages(); // Перерисовываем чат, чтобы появилась галочка
                        }
                    }
                }
            }
        });

        // Если друг закрыл вкладку или пропал интернет
        conn.on('close', () => {
            delete connections[conn.peer];
            renderContacts();
            if (activePeerId === conn.peer) {
                document.getElementById('chatStatus').innerText = "Статус: Офлайн";
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
            }
        });
    }

    function sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !activePeerId) return;

        const conn = connections[activePeerId];
        if (!conn) {
            alert("Собеседник сейчас не в сети. Отправка невозможна.");
            return;
        }

        const msgId = Math.random().toString(36).substring(2, 11);
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        const msgData = {
            id: msgId,
            text: text,
            time: time
        };

        // Записываем себе в историю (пока без галочки доставлено)
        const localMsg = {
            id: msgId,
            sender: 'outgoing',
            text: text,
            time: time,
            delivered: false
        };

        chatHistory[activePeerId].messages.push(localMsg);
        saveHistory();
        appendMessage(localMsg);

        // Пуляем по прямому каналу
        conn.send({
            type: 'TEXT',
            id: msgId,
            text: text,
            time: time
        });

        input.value = '';
    }

    function selectContact(peerId) {
        activePeerId = peerId;
        const target = chatHistory[peerId];
        if (!target) return;

        document.getElementById('chatTitle').innerText = target.nickname;
        
        const isOnline = !!connections[peerId];
        document.getElementById('chatStatus').innerText = isOnline ? "Статус: В сети (Прямое P2P)" : "Статус: Офлайн";
        
        document.getElementById('messageInput').disabled = !isOnline;
        document.getElementById('sendBtn').disabled = !isOnline;

        renderMessages();
        renderContacts();
    }

    function renderContacts() {
        const list = document.getElementById('contactsList');
        list.innerHTML = '';

        Object.keys(chatHistory).forEach(peerId => {
            const chat = chatHistory[peerId];
            const isOnline = !!connections[peerId];
            const div = document.createElement('div');
            div.className = `contact-item ${activePeerId === peerId ? 'active' : ''}`;
            div.onclick = () => selectContact(peerId);

            const lastMsg = chat.messages[chat.messages.length - 1];
            const lastTxt = lastMsg ? lastMsg.text : 'Нет сообщений';

            div.innerHTML = `
                <div class="contact-avatar" style="background: ${isOnline ? 'var(--accent)' : '#475569'}">
                    ${chat.nickname.substring(0,2).toUpperCase()}
                </div>
                <div class="contact-info">
                    <h4>${chat.nickname} ${isOnline ? '🟢' : '🔴'}</h4>
                    <p>${lastTxt}</p>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function renderMessages() {
        const container = document.getElementById('messagesContainer');
        container.innerHTML = '';
        
        if (!activePeerId || !chatHistory[activePeerId].messages.length) {
            container.innerHTML = `<div class="welcome-msg">Чат пуст. Напишите что-нибудь!</div>`;
            return;
        }

        chatHistory[activePeerId].messages.forEach(msg => appendMessage(msg));
    }

    function appendMessage(msg) {
        const container = document.getElementById('messagesContainer');
        const welcome = container.querySelector('.welcome-msg');
        if(welcome) welcome.remove();

        const isMe = msg.sender === 'outgoing';
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'outgoing' : 'incoming'}`;
        
        // Галочка доставки только для наших исходящих сообщений
        const statusHtml = (isMe && msg.delivered) ? `<i class="fas fa-check status-icon" title="Доставлено на устройство"></i>` : '';

        div.innerHTML = `
            <div class="text">${escapeHTML(msg.text)}</div>
            <div class="meta-box">
                <span class="time">${msg.time}</span>
                ${statusHtml}
            </div>
        `;
        
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function changeNickname() {
        const n = prompt("Ваш новый никнейм:", myNickname);
        if(n && n.trim() !== "") {
            myNickname = n.trim();
            localStorage.setItem('p2p_nick', myNickname);
            document.getElementById('myNickDisplay').innerText = myNickname;
            // Рассылаем всем активным контактам инфу о смене ника
            Object.values(connections).forEach(conn => {
                conn.send({ type: 'SYSTEM_NICK', nickname: myNickname });
            });
        }
    }

    function copyMyId() {
        const id = document.getElementById('myIdDisplay').innerText;
        if(id && id !== "Генерация...") {
            navigator.clipboard.writeText(id);
            alert("Ваш P2P ID скопирован! Отправьте его другу.");
        }
    }

    function saveHistory() {
        localStorage.setItem('p2p_history', JSON.stringify(chatHistory));
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }

    // Регистрация Сервис Воркера для PWA
    if ('serviceWorker' in navigator) {
        const swText = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const blob = new Blob([swText], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob));
    }
</script>
</body>
</html>
