<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Carbon Cyber Tycoon</title>
  
  <!-- PWA Meta Tags для убирания адресной строки -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carbon Game">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d0d11">
  
  <!-- Inline Web App Manifest -->
  <link rel="manifest" href='data:application/json,{"name":"Carbon Cyber Tycoon","short_name":"CarbonTycoon","start_url":".","display":"standalone","background_color":"#0d0d11","theme_color":"#0d0d11","orientation":"portrait"}'>

  <style>
    :root {
      --bg-dark: #0b0c10;
      --carbon-1: #1f232a;
      --carbon-2: #16191f;
      --accent-cyan: #00f0ff;
      --accent-green: #00ff88;
      --accent-purple: #7000ff;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* Текстура карбонового волокна */
      background-image: 
        radial-gradient(rgba(0,0,0,0.7) 15%, transparent 16%),
        radial-gradient(rgba(255,255,255,0.03) 15%, transparent 16%),
        linear-gradient(45deg, transparent 48%, rgba(20,20,25,0.8) 50%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, rgba(20,20,25,0.8) 50%, transparent 52%);
      background-size: 10px 10px, 10px 10px, 20px 20px, 20px 20px;
      background-position: 0 0, 5px 5px, 0 0, 0 0;
    }

    .app-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
    }

    /* Шапка со статистикой */
    header {
      background: linear-gradient(135deg, var(--carbon-1), var(--carbon-2));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }

    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title-bar h1 {
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .badge {
      font-size: 10px;
      padding: 4px 8px;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      border-radius: 12px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .stat-display {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .balance-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance-val {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .cps-val {
      font-size: 13px;
      color: var(--accent-green);
      font-weight: 600;
      margin-top: 4px;
    }

    /* Навигационные вкладки */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: var(--carbon-2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(112, 0, 255, 0.15));
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    /* Основной контент */
    .content-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Зона кликера */
    .clicker-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .carbon-core {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, #2a2f3a 0%, #121418 100%);
      border: 3px solid var(--accent-cyan);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.05s ease;
      background-image: 
        repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 2px, transparent 0, transparent 4px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,0.5) 0, rgba(0,0,0,0.5) 2px, transparent 0, transparent 4px);
    }

    .carbon-core:active {
      transform: scale(0.94);
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.6), inset 0 0 30px rgba(0, 0, 0, 0.9);
    }

    .core-icon {
      font-size: 64px;
      filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.6));
    }

    /* Карточки апгрейдов */
    .upgrade-card {
      background: linear-gradient(135deg, var(--carbon-1), var(--carbon-2));
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .upgrade-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--accent-cyan);
      opacity: 0.5;
    }

    .upgrade-card.disabled {
      opacity: 0.5;
      filter: grayscale(0.8);
    }

    .upgrade-info h3 {
      font-size: 14px;
      color: #fff;
      margin-bottom: 4px;
    }

    .upgrade-info p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .upgrade-btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 240, 255, 0.2);
    }

    /* Всплывающие цифры при клике */
    .float-num {
      position: absolute;
      font-weight: 900;
      font-size: 22px;
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(0,240,255,0.8);
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }

    .pwa-hint {
      margin-top: 12px;
      font-size: 10px;
      text-align: center;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="title-bar">
        <h1>Carbon Tycoon</h1>
        <span class="badge">Offline PWA</span>
      </div>
      <div class="stat-display">
        <div>
          <div class="balance-label">Активы (CRB)</div>
          <div class="balance-val" id="balance">0</div>
        </div>
        <div style="text-align: right;">
          <div class="balance-label">Доход в сек</div>
          <div class="cps-val" id="cps">+0 /сек</div>
        </div>
      </div>
    </header>

    <div class="nav-tabs">
      <div class="tab-btn active" onclick="switchTab('clicker')">Майнинг</div>
      <div class="tab-btn" onclick="switchTab('upgrades')">Апгрейды</div>
      <div class="tab-btn" onclick="switchTab('stats')">Статс</div>
    </div>

    <div class="content-area">
      <!-- ВКЛАДКА МАЙНИНГА -->
      <div id="tab-clicker" class="clicker-zone">
        <div class="carbon-core" id="coreBtn">
          <div class="core-icon">⚡</div>
        </div>
      </div>

      <!-- ВКЛАДКА АПГРЕЙДОВ -->
      <div id="tab-upgrades" style="display: none; flex-direction: column; gap: 10px;">
        <!-- Апгрейды рендерятся из JS -->
      </div>

      <!-- ВКЛАДКА СТАТИСТИКИ -->
      <div id="tab-stats" style="display: none; flex-direction: column; gap: 10px;">
        <div class="upgrade-card">
          <div class="upgrade-info">
            <h3>Всего кликов</h3>
            <p id="totalClicks">0</p>
          </div>
        </div>
        <div class="upgrade-card">
          <div class="upgrade-info">
            <h3>Сила клика</h3>
            <p id="clickPower">1 CRB</p>
          </div>
        </div>
        <div class="upgrade-card" style="cursor: pointer;" onclick="resetProgress()">
          <div class="upgrade-info">
            <h3 style="color: #ff4757;">Сбросить прогресс</h3>
            <p>Начать заново</p>
          </div>
        </div>
      </div>
    </div>

    <div class="pwa-hint">
      Нажми "Поделиться" ➔ "На экран Домой" для полноэкранного режима
    </div>
  </div>

  <script>
    let state = {
      balance: 0,
      cps: 0,
      clickPower: 1,
      totalClicks: 0,
      upgrades: [
        { id: 'gpu', name: 'Карбоновый Чип', cost: 15, cps: 1, count: 0, icon: '💎' },
        { id: 'rig', name: 'Кибер Массив', cost: 100, cps: 8, count: 0, icon: '🖥️' },
        { id: 'ai', name: 'ИИ Маркетолог', cost: 1100, cps: 40, count: 0, icon: '🤖' },
        { id: 'quantum', name: 'Квантовый Сервер', cost: 12000, cps: 260, count: 0, icon: '🌌' }
      ]
    };

    // Загрузка
    const saved = localStorage.getItem('carbon_game_save');
    if (saved) {
      try { state = JSON.parse(saved); } catch(e){}
    }

    const balanceEl = document.getElementById('balance');
    const cpsEl = document.getElementById('cps');
    const coreBtn = document.getElementById('coreBtn');
    const upgradesContainer = document.getElementById('tab-upgrades');

    function saveGame() {
      localStorage.setItem('carbon_game_save', JSON.stringify(state));
    }

    function formatNum(num) {
      if (num >= 1e6) return (num/1e6).toFixed(2) + 'M';
      if (num >= 1e3) return (num/1e3).toFixed(1) + 'K';
      return Math.floor(num).toLocaleString();
    }

    function updateUI() {
      balanceEl.textContent = formatNum(state.balance);
      cpsEl.textContent = '+' + formatNum(state.cps) + ' /сек';
      document.getElementById('totalClicks').textContent = state.totalClicks;
      document.getElementById('clickPower').textContent = formatNum(state.clickPower) + ' CRB';
      renderUpgrades();
    }

    function renderUpgrades() {
      upgradesContainer.innerHTML = '';
      state.upgrades.forEach((up, idx) => {
        const canAfford = state.balance >= up.cost;
        const card = document.createElement('div');
        card.className = 'upgrade-card' + (canAfford ? '' : ' disabled');
        card.innerHTML = `
          <div class="upgrade-info">
            <h3>${up.icon} ${up.name} (${up.count})</h3>
            <p>+${up.cps} CRB/сек | Цена: ${formatNum(up.cost)}</p>
          </div>
          <button class="upgrade-btn" onclick="buyUpgrade(${idx})">Купить</button>
        `;
        upgradesContainer.appendChild(card);
      });
    }

    // Клик по ядру
    coreBtn.addEventListener('click', (e) => {
      state.balance += state.clickPower;
      state.totalClicks++;
      
      const rect = coreBtn.getBoundingClientRect();
      const x = e.clientX || (rect.left + rect.width/2);
      const y = e.clientY || (rect.top + rect.height/2);
      
      const numEl = document.createElement('div');
      numEl.className = 'float-num';
      numEl.textContent = '+' + state.clickPower;
      numEl.style.left = (x - 15) + 'px';
      numEl.style.top = (y - 30) + 'px';
      document.body.appendChild(numEl);
      
      setTimeout(() => numEl.remove(), 800);

      if (navigator.vibrate) navigator.vibrate(15);

      updateUI();
      saveGame();
    });

    window.buyUpgrade = function(idx) {
      const up = state.upgrades[idx];
      if (state.balance >= up.cost) {
        state.balance -= up.cost;
        up.count++;
        state.cps += up.cps;
        up.cost = Math.floor(up.cost * 1.15);
        state.clickPower += Math.ceil(up.cps * 0.1);

        if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
        updateUI();
        saveGame();
      }
    };

    window.switchTab = function(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab-clicker').style.display = 'none';
      document.getElementById('tab-upgrades').style.display = 'none';
      document.getElementById('tab-stats').style.display = 'none';

      event.target.classList.add('active');
      document.getElementById('tab-' + tabName).style.display = 'flex';
    };

    window.resetProgress = function() {
      if (confirm('Сбросить прогресс?')) {
        localStorage.removeItem('carbon_game_save');
        location.reload();
      }
    };

    // Пассивный доход
    setInterval(() => {
      if (state.cps > 0) {
        state.balance += state.cps;
        updateUI();
        saveGame();
      }
    }, 1000);

    updateUI();
  </script>
</body>
</html>
