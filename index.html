<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Private Clone v2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"Наш Мессенджер","short_name":"Чат","start_url":".","display":"standalone","background_color":"#0e1621","theme_color":"#17212b","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2525/2525779.png","sizes":"512x512","type":"image/png"}]}'>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h3>Группы / Комнаты</h3>
            <button onclick="joinRoom()" title="Войти в комнату"><i class="fas fa-plus"></i></button>
        </div>
        
        <div class="rooms-list" id="roomsList">
            </div>

        <div class="profile-zone">
            <div class="profile-info">
                <div class="my-avatar" id="myAvatar">U</div>
                <div class="profile-meta">
                    <span id="myNickDisplay">Загрузка...</span>
                    <small onclick="changeNickname()">Сменить ник <i class="fas fa-pen"></i></small>
                </div>
            </div>
            <div class="status-indicator" id="netStatus" title="Статус подключения"></div>
        </div>
    </aside>

    <main class="chat-area">
        <div class="chat-header" id="chatHeader" style="display: none;">
            <div class="chat-title-info">
                <h3 id="currentRoomTitle">Название комнаты</h3>
                <p id="currentRoomKey">Ключ: ...</p>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="intro-screen">
                <i class="fas fa-paper-plane plane-icon"></i>
                <h2>Наш приватный чат</h2>
                <p>1. Нажмите на <b>плюсик</b> слева.</p>
                <p>2. Придумайте секретное имя комнаты (например: <code>bratva777</code>).</p>
                <p>3. Скажите это имя друзьям — они войдут и вы сразу в сети!</p>
            </div>
        </div>

        <form class="input-form" onsubmit="handleSend(event)">
            <input type="text" id="msgInput" placeholder="Напишите сообщение..." autocomplete="off" disabled>
            <button type="submit" id="sendBtn" disabled><i class="fas fa-arrow-up"></i></button>
        </form>
    </main>
</div>

<style>
    :root {
        --bg-main: #0e1621;
        --bg-sidebar: #17212b;
        --bg-chat: #0f172a;
        --text: #f5f5f5;
        --text-muted: #6c7a89;
        --accent: #2481cc;
        --msg-out: #2b5278;
        --msg-in: #182533;
        --border: #101924;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-main); color: var(--text); height: 100vh; overflow: hidden; }
    
    .app-container { display: flex; height: 100vh; width: 100vw; }

    /* Сайдбар */
    .sidebar { width: 300px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .sidebar-header button { background: var(--accent); border: none; color: white; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; }
    
    .rooms-list { flex: 1; overflow-y: auto; }
    .room-item { padding: 15px 20px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 12px; }
    .room-item:hover, .room-item.active { background: #202b36; }
    .room-icon { width: 40px; height: 40px; background: #2e3b4e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    
    .profile-zone { padding: 15px 20px; background: #111921; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .profile-info { display: flex; align-items: center; gap: 10px; }
    .my-avatar { width: 35px; height: 35px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .profile-meta { display: flex; flex-direction: column; }
    .profile-meta small { color: var(--accent); cursor: pointer; font-size: 0.75rem; margin-top: 2px; }
    .status-indicator { width: 12px; height: 12px; border-radius: 50%; background: #ef4444; transition: 0.3s; }
    .status-indicator.online { background: #10b981; box-shadow: 0 0 8px #10b981; }

    /* Чат */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
    .chat-header { padding: 15px 20px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); }
    .chat-title-info h3 { font-size: 1.05rem; }
    .chat-title-info p { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .intro-screen { margin: auto; text-align: center; max-width: 350px; color: var(--text-muted); }
    .plane-icon { font-size: 3.5rem; color: var(--accent); margin-bottom: 15px; }
    .intro-screen h2 { color: white; margin-bottom: 10px; font-size: 1.4rem; }
    .intro-screen p { font-size: 0.9rem; text-align: left; margin-bottom: 6px; }

    /* Стиль бабблов сообщений */
    .message-row { display: flex; width: 100%; margin-bottom: 2px; }
    .message-row.out { justify-content: flex-end; }
    .message-row.in { justify-content: flex-start; }

    .message-bubble { max-width: 65%; padding: 8px 14px; border-radius: 14px; position: relative; display: flex; flex-direction: column; }
    .message-row.out .message-bubble { background: var(--msg-out); border-bottom-right-radius: 2px; }
    .message-row.in .message-bubble { background: var(--msg-in); border-bottom-left-radius: 2px; }

    .msg-author { font-size: 0.8rem; font-weight: bold; margin-bottom: 3px; }
    .msg-text { font-size: 0.95rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
    
    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 3px; font-size: 0.65rem; color: var(--text-muted); }
    .msg-meta i { color: #10b981; }

    /* Поле ввода */
    .input-form { padding: 15px 20px; background: var(--bg-sidebar); display: flex; gap: 10px; }
    .input-form input { flex: 1; background: var(--bg-main); border: 1px solid var(--border); padding: 12px 15px; border-radius: 8px; color: white; font-size: 1rem; outline: none; }
    .input-form input:focus { border-color: var(--accent); }
    .input-form button { background: var(--accent); border: none; color: white; width: 44px; height: 44px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }
    .input-form button:disabled { background: #202b36; color: var(--text-muted); cursor: not-allowed; }

    @media (max-width: 650px) {
        .app-container { flex-direction: column; }
        .sidebar { width: 100%; height: 35%; }
        .chat-area { height: 65%; }
    }
</style>

<script>
    // Используем ультра-стабильный публичный WebSocket сервер
    const WS_SERVER = "wss://iot.eclipseorg.io/ws"; 
    const CHAT_PREFIX = "tg_pvt_v2_";

    let ws = null;
    let myNickname = localStorage.getItem('tg_v2_nick') || 'Бро_' + Math.floor(100 + Math.random() * 900);
    let activeRoom = null;
    let rooms = JSON.parse(localStorage.getItem('tg_v2_rooms')) || {};

    window.addEventListener('DOMContentLoaded', () => {
        updateProfileUI();
        connectWebSocket();
        renderRooms();
    });

    function connectWebSocket() {
        // Создаем чистое WebSocket подключение по протоколу MQTT-over-WS
        ws = new WebSocket(WS_SERVER, 'mqtt');
        
        ws.onopen = () => {
            document.getElementById('netStatus').className = "status-indicator online";
            // Посылаем базовый MQTT пакет Connect
            ws.send(new Uint8Array([0x10, 12, 0, 4, 77, 81, 84, 84, 4, 2, 0, 60, 0, 0]));
            // Переподписываемся на наши комнаты
            Object.keys(rooms).forEach(roomName => subscribeToRoom(roomName));
        };

        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const reader = new FileReader();
                reader.onload = () => parseMqttPacket(new Uint8Array(reader.result));
                reader.readAsArrayBuffer(event.data);
            }
        };

        ws.onclose = () => {
            document.getElementById('netStatus').className = "status-indicator";
            setTimeout(connectWebSocket, 3000); // Авто-реконнект если пропала сеть
        };
    }

    function parseMqttPacket(data) {
        // Простейший парсер входящих сообщений MQTT Publish
        if ((data[0] & 0xF0) === 0x30) { 
            let idx = 1;
            let len = 0;
            let multiplier = 1;
            // Читаем длину пакета
            do {
                len += (data[idx] & 127) * multiplier;
                multiplier *= 128;
            } while ((data[idx++] & 128) != 0);

            const topicLen = (data[idx] << 8) + data[idx+1];
            idx += 2;
            const topic = new TextDecoder().decode(data.subarray(idx, idx + topicLen));
            idx += topicLen;
            
            // Если в пакете есть Message ID (QoS 1)
            if ((data[0] & 0x06) > 0) idx += 2;

            const payloadStr = new TextDecoder().decode(data.subarray(idx));
            
            try {
                const packet = JSON.parse(payloadStr);
                handleIncomingJson(topic, packet);
            } catch(e){}
        }
    }

    function handleIncomingJson(topic, data) {
        const roomName = topic.replace(CHAT_PREFIX, '');
        if (!rooms[roomName]) return;

        // 1. Получен ТЕКСТ
        if (data.type === 'MSG') {
            // Проверка на дубликаты
            if (rooms[roomName].messages.some(m => m.id === data.id)) return;

            rooms[roomName].messages.push(data);
            saveData();

            // Отправляем автоматическое подтверждение доставки (ACK) другу
            if (data.sender !== myNickname) {
                sendJson(roomName, { type: 'ACK', id: data.id });
            }

            if (activeRoom === roomName) {
                appendMessage(data);
            } else {
                renderRooms();
            }
        }

        // 2. Получено ПОДТВЕРЖДЕНИЕ ДОСТАВКИ (ACK)
        if (data.type === 'ACK') {
            const targetMsg = rooms[roomName].messages.find(m => m.id === data.id);
            if (targetMsg) {
                targetMsg.delivered = true;
                saveData();
                if (activeRoom === roomName) {
                    renderMessages(); // Обновляем экран, рисуем галочку
                }
            }
        }
    }

    function subscribeToRoom(roomName) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const topic = CHAT_PREFIX + roomName;
        const encoder = new TextEncoder();
        const topicBytes = encoder.encode(topic);
        const packet = new Uint8Array([0x82, 5 + topicBytes.length, 0, 1, 0, topicBytes.length, ...topicBytes, 0]);
        ws.send(packet);
    }

    function sendJson(roomName, obj) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const topic = CHAT_PREFIX + roomName;
        const encoder = new TextEncoder();
        const topicBytes = encoder.encode(topic);
        const payloadBytes = encoder.encode(JSON.stringify(obj));
        
        // Сборка MQTT пакета Publish
        const remainLen = 2 + topicBytes.length + payloadBytes.length;
        const packet = new Uint8Array([0x30, remainLen, 0, topicBytes.length, ...topicBytes, ...payloadBytes]);
        ws.send(packet);
    }

    function joinRoom() {
        const roomName = prompt("Введите секретное имя/ключ комнаты (английскими буквами без пробелов):");
        if (!roomName) return;
        const cleanName = roomName.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        if (!cleanName) return;

        if (!rooms[cleanName]) {
            rooms[cleanName] = { name: cleanName, messages: [] };
        }
        
        subscribeToRoom(cleanName);
        saveData();
        renderRooms();
        selectRoom(cleanName);
    }

    function selectRoom(name) {
        activeRoom = name;
        
        document.getElementById('chatHeader').style.display = "block";
        document.getElementById('currentRoomTitle').innerText = `Комната: #${rooms[name].name}`;
        document.getElementById('currentRoomKey').innerText = `Передайте это имя друзьям для входа`;

        document.getElementById('msgInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;

        renderMessages();
        renderRooms();
    }

    function handleSend(e) {
        e.preventDefault();
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !activeRoom) return;

        const msgData = {
            id: 'm-' + Math.random().toString(36).substring(2, 11),
            type: 'MSG',
            sender: myNickname,
            text: text,
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            delivered: false
        };

        // Записываем себе в историю
        rooms[activeRoom].messages.push(msgData);
        saveData();
        appendMessage(msgData);

        // Отправляем в сеть
        sendJson(activeRoom, msgData);
        
        input.value = '';
    }

    function renderRooms() {
        const list = document.getElementById('roomsList');
        list.innerHTML = '';
        
        Object.keys(rooms).forEach(k => {
            const r = rooms[k];
            const div = document.createElement('div');
            div.className = `room-item ${activeRoom === k ? 'active' : ''}`;
            div.onclick = () => selectRoom(k);
            
            const lastMsg = r.messages[r.messages.length - 1];
            const lastText = lastMsg ? `${lastMsg.sender}: ${lastMsg.text}` : 'Нет сообщений';

            div.innerHTML = `
                <div class="room-icon">${r.name.substring(0,2).toUpperCase()}</div>
                <div style="flex:1; overflow:hidden;">
                    <h4 style="font-size:0.95rem;">#${r.name}</h4>
                    <p style="font-size:0.8rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${lastText}</p>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function renderMessages() {
        const container = document.getElementById('messagesContainer');
        container.innerHTML = '';
        if (!activeRoom || !rooms[activeRoom].messages.length) {
            container.innerHTML = '<div class="intro-screen">Никто еще не писал в этот чат. Будь первым!</div>';
            return;
        }
        rooms[activeRoom].messages.forEach(m => appendMessage(m));
    }

    function appendMessage(msg) {
        const container = document.getElementById('messagesContainer');
        const intro = container.querySelector('.intro-screen');
        if (intro) intro.remove();

        const isMe = msg.sender === myNickname;
        const row = document.createElement('div');
        row.className = `message-row ${isMe ? 'out' : 'in'}`;

        // Генерируем красивый уникальный цвет для ника собеседника
        const nameColor = stringToColor(msg.sender);
        const checkIcon = (isMe && msg.delivered) ? '<i class="fas fa-check"></i>' : '';

        row.innerHTML = `
            <div class="message-bubble">
                ${!isMe ? `<span class="msg-author" style="color: ${nameColor}">${escapeHTML(msg.sender)}</span>` : ''}
                <div class="msg-text">${escapeHTML(msg.text)}</div>
                <div class="msg-meta">
                    <span>${msg.time}</span>
                    ${checkIcon}
                </div>
            </div>
        `;

        container.appendChild(row);
        container.scrollTop = container.scrollHeight;
    }

    // Хэш-функция для генерации уникального цвета никнейма (как в TG)
    function stringToColor(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        const colors = ['#34d399', '#60a5fa', '#f43f5e', '#fbbf24', '#a78bfa', '#fb7185', '#38bdf8', '#f472b6'];
        return colors[Math.abs(hash) % colors.length];
    }

    function changeNickname() {
        const n = prompt("Придумайте новый никнейм:", myNickname);
        if (n && n.trim() !== "") {
            myNickname = n.trim();
            localStorage.setItem('tg_v2_nick', myNickname);
            updateProfileUI();
            if(activeRoom) renderMessages();
        }
    }

    function updateProfileUI() {
        document.getElementById('myNickDisplay').innerText = myNickname;
        document.getElementById('myAvatar').innerText = myNickname.substring(0,1).toUpperCase();
        document.getElementById('myAvatar').style.background = stringToColor(myNickname);
    }

    function saveData() {
        localStorage.setItem('tg_v2_rooms', JSON.stringify(rooms));
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }
</script>
</body>
</html>
