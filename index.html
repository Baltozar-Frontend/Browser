<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Carbon Tycoon</title>

  <!-- 1. Главный переключатель PWA для iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carbon">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0c10">

  <!-- 2. Встроенная Иконка (Вшита в код через SVG Data URL - без внешних файлов) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b0c10'/><text x='50%' y='68%' font-size='65' text-anchor='middle'>⚡</text></svg>">

  <!-- 3. Встроенный PWA Manifest (Вшит прямо в один файл) -->
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Carbon%20Tycoon%22,%22short_name%22:%22Carbon%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230b0c10%22,%22theme_color%22:%22%230b0c10%22}">

  <style>
    :root {
      --bg-dark: #0b0c10;
      --carbon-1: #1a1d24;
      --carbon-2: #121419;
      --accent-cyan: #00f0ff;
      --accent-green: #00ff88;
      --accent-purple: #7000ff;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(rgba(0,0,0,0.8) 15%, transparent 16%),
        radial-gradient(rgba(255,255,255,0.04) 15%, transparent 16%),
        linear-gradient(45deg, transparent 48%, rgba(20,24,30,0.9) 50%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, rgba(20,24,30,0.9) 50%, transparent 52%);
      background-size: 8px 8px, 8px 8px, 16px 16px, 16px 16px;
      background-position: 0 0, 4px 4px, 0 0, 0 0;
    }

    .app-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: max(env(safe-area-inset-top), 20px);
      padding-bottom: max(env(safe-area-inset-bottom), 16px);
      padding-left: 16px;
      padding-right: 16px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--carbon-1), var(--carbon-2));
      border: 1px solid rgba(0, 240, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .title-bar h1 {
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    .status-badge {
      font-size: 10px;
      padding: 3px 8px;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      border-radius: 10px;
      font-weight: bold;
    }

    .stat-display {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .balance-val {
      font-size: 30px;
      font-weight: 900;
      color: #fff;
    }

    .cps-val {
      font-size: 12px;
      color: var(--accent-green);
      font-weight: 600;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: var(--carbon-2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(112, 0, 255, 0.2));
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .clicker-zone {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .carbon-core {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, #252a34 0%, #0f1115 100%);
      border: 3px solid var(--accent-cyan);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.35), inset 0 0 25px rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.05s ease;
      touch-action: manipulation;
    }

    .carbon-core:active {
      transform: scale(0.92);
    }

    .core-icon {
      font-size: 60px;
    }

    .upgrade-card {
      background: linear-gradient(135deg, var(--carbon-1), var(--carbon-2));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .upgrade-card.disabled {
      opacity: 0.4;
    }

    .upgrade-btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 12px;
    }

    .float-num {
      position: absolute;
      font-weight: 900;
      font-size: 24px;
      color: var(--accent-cyan);
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-50px); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="title-bar">
        <h1>Carbon Tycoon</h1>
        <span class="status-badge">Carbon PWA</span>
      </div>
      <div class="stat-display">
        <div>
          <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Баланс CRB</div>
          <div class="balance-val" id="balance">0</div>
        </div>
        <div style="text-align: right;">
          <div class="cps-val" id="cps">+0 /сек</div>
        </div>
      </div>
    </header>

    <div class="nav-tabs">
      <div class="tab-btn active" onclick="switchTab('clicker', event)">Майнинг</div>
      <div class="tab-btn" onclick="switchTab('upgrades', event)">Апгрейды</div>
      <div class="tab-btn" onclick="switchTab('stats', event)">Инфо</div>
    </div>

    <div class="content-area">
      <div id="tab-clicker" class="clicker-zone">
        <div class="carbon-core" id="coreBtn">
          <div class="core-icon">⚡</div>
        </div>
      </div>

      <div id="tab-upgrades" style="display: none; flex-direction: column;"></div>

      <div id="tab-stats" style="display: none; flex-direction: column;">
        <div class="upgrade-card">
          <div>
            <h3 style="font-size: 14px;">Всего кликов</h3>
            <p style="font-size: 12px; color: var(--text-muted);" id="totalClicks">0</p>
          </div>
        </div>
        <div class="upgrade-card" onclick="resetProgress()" style="cursor: pointer;">
          <div>
            <h3 style="font-size: 14px; color: #ff4757;">Сбросить Прогресс</h3>
            <p style="font-size: 11px; color: var(--text-muted);">Начать заново</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Игровая логика
    let state = {
      balance: 0,
      cps: 0,
      clickPower: 1,
      totalClicks: 0,
      upgrades: [
        { name: 'Карбоновый Чип', cost: 15, cps: 1, count: 0, icon: '💎' },
        { name: 'Кибер Массив', cost: 100, cps: 8, count: 0, icon: '🖥️' },
        { name: 'ИИ Маркетолог', cost: 1100, cps: 40, count: 0, icon: '🤖' }
      ]
    };

    const saved = localStorage.getItem('carbon_pwa_save');
    if (saved) { try { state = JSON.parse(saved); } catch(e){} }

    function save() { localStorage.setItem('carbon_pwa_save', JSON.stringify(state)); }

    function format(num) {
      if (num >= 1e6) return (num/1e6).toFixed(2) + 'M';
      if (num >= 1e3) return (num/1e3).toFixed(1) + 'K';
      return Math.floor(num);
    }

    function updateUI() {
      document.getElementById('balance').textContent = format(state.balance);
      document.getElementById('cps').textContent = '+' + format(state.cps) + ' /сек';
      document.getElementById('totalClicks').textContent = state.totalClicks;
      renderUpgrades();
    }

    function renderUpgrades() {
      const container = document.getElementById('tab-upgrades');
      container.innerHTML = '';
      state.upgrades.forEach((up, idx) => {
        const canAfford = state.balance >= up.cost;
        const div = document.createElement('div');
        div.className = 'upgrade-card' + (canAfford ? '' : ' disabled');
        div.innerHTML = `
          <div>
            <h3 style="font-size:14px;">${up.icon} ${up.name} (${up.count})</h3>
            <p style="font-size:11px; color: var(--text-muted);">+${up.cps}/сек | Цена: ${format(up.cost)}</p>
          </div>
          <button class="upgrade-btn" onclick="buy(${idx})">Купить</button>
        `;
        container.appendChild(div);
      });
    }

    const coreBtn = document.getElementById('coreBtn');
    coreBtn.addEventListener('click', (e) => {
      state.balance += state.clickPower;
      state.totalClicks++;

      const rect = coreBtn.getBoundingClientRect();
      const num = document.createElement('div');
      num.className = 'float-num';
      num.textContent = '+' + state.clickPower;
      num.style.left = (e.clientX || (rect.left + 80)) + 'px';
      num.style.top = ((e.clientY || rect.top) - 20) + 'px';
      document.body.appendChild(num);
      setTimeout(() => num.remove(), 700);

      if (navigator.vibrate) navigator.vibrate(12);
      updateUI();
      save();
    });

    window.buy = function(idx) {
      const up = state.upgrades[idx];
      if (state.balance >= up.cost) {
        state.balance -= up.cost;
        up.count++;
        state.cps += up.cps;
        up.cost = Math.floor(up.cost * 1.2);
        updateUI();
        save();
      }
    };

    window.switchTab = function(name, e) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-clicker').style.display = 'none';
      document.getElementById('tab-upgrades').style.display = 'none';
      document.getElementById('tab-stats').style.display = 'none';

      e.target.classList.add('active');
      document.getElementById('tab-' + name).style.display = 'flex';
    };

    window.resetProgress = function() {
      if (confirm('Очистить данные?')) {
        localStorage.removeItem('carbon_pwa_save');
        location.reload();
      }
    };

    setInterval(() => {
      if (state.cps > 0) {
        state.balance += state.cps;
        updateUI();
        save();
      }
    }, 1000);

    updateUI();
  </script>
</body>
</html>
