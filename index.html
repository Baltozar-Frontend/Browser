<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>P2P Terraria Clone with Clans</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        canvas { display: block; image-rendering: pixelated; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); color: white; padding: 15px;
            border-radius: 8px; pointer-events: auto;
        }
        input, button { margin: 5px 0; padding: 5px; width: 100%; display: block; }
        .stats { position: absolute; bottom: 10px; left: 10px; color: white; text-shadow: 1px 1px 2px black; }
    </style>
</head>
<body>

<div id="ui">
    <b id="my-id-display">Ваш ID: Загрузка...</b>
    <input type="text" id="peer-id-input" placeholder="ID друга для подключения">
    <button onclick="connectToPeer()">Подключиться к другу</button>
    <hr>
    <input type="text" id="name-input" placeholder="Ваше имя" value="Игрок">
    <input type="text" id="clan-input" placeholder="Название клана" value="Бродяги">
    <p style="font-size: 10px;">ЛКМ - Копать, ПКМ - Строить<br>WASD - Движение</p>
</div>

<div class="stats" id="stats">Подключено игроков: 1</div>

<canvas id="gameCanvas"></canvas>

<script>
/** КОНФИГУРАЦИЯ **/
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const TILE_SIZE = 32;
const GRAVITY = 0.5;
const JUMP_FORCE = -10;
const SPEED = 4;

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/** МИР **/
const WORLD_WIDTH = 100;
const WORLD_HEIGHT = 50;
let world = [];

// Генерация мира
function generateWorld() {
    for (let x = 0; x < WORLD_WIDTH; x++) {
        world[x] = [];
        for (let y = 0; y < WORLD_HEIGHT; y++) {
            let type = 0; // 0 - воздух
            if (y > 20) type = 1; // трава/земля
            if (y > 25) type = 2; // камень
            world[x][y] = type;
        }
    }
}
generateWorld();

/** ИГРОК **/
let player = {
    x: 400, y: 100,
    vx: 0, vy: 0,
    w: 24, h: 48,
    grounded: false,
    name: "Игрок",
    clan: "Бродяги",
    color: `hsl(${Math.random() * 360}, 70%, 50%)`
};

let remotePlayers = {};
let keys = {};

/** СЕТЕВАЯ ЧАСТЬ (PeerJS) **/
const peer = new Peer();
let connections = [];

peer.on('open', (id) => {
    document.getElementById('my-id-display').innerText = "Ваш ID: " + id;
});

// Когда к нам подключаются
peer.on('connection', (conn) => {
    setupConnection(conn);
});

function connectToPeer() {
    const peerId = document.getElementById('peer-id-input').value;
    const conn = peer.connect(peerId);
    setupConnection(conn);
}

function setupConnection(conn) {
    conn.on('open', () => {
        connections.push(conn);
        // Отправляем данные о себе при входе
        conn.send({ type: 'init_world', world: world });
    });

    conn.on('data', (data) => {
        if (data.type === 'init_world') {
            world = data.world; // Синхронизация мира при подключении к хосту
        }
        if (data.type === 'update') {
            remotePlayers[data.id] = data.state;
        }
        if (data.type === 'block_change') {
            world[data.x][data.y] = data.blockType;
        }
    });

    conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
    });
}

/** УПРАВЛЕНИЕ **/
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    
    const worldX = Math.floor(mouseX / TILE_SIZE);
    const worldY = Math.floor(mouseY / TILE_SIZE);

    if (worldX >= 0 && worldX < WORLD_WIDTH && worldY >= 0 && worldY < WORLD_HEIGHT) {
        const blockType = e.button === 0 ? 0 : 2; // ЛКМ - воздух, ПКМ - камень
        world[worldX][worldY] = blockType;
        
        // Рассылка изменений блока
        broadcast({ type: 'block_change', x: worldX, y: worldY, blockType: blockType });
    }
});

// Отключаем контекстное меню для ПКМ
canvas.oncontextmenu = (e) => e.preventDefault();

function broadcast(data) {
    connections.forEach(conn => conn.send(data));
}

/** ЛОГИКА И ОТРИСОВКА **/
function update() {
    // Обновление данных игрока из инпутов
    player.name = document.getElementById('name-input').value;
    player.clan = document.getElementById('clan-input').value;

    // Движение
    if (keys['KeyA']) player.vx = -SPEED;
    else if (keys['KeyD']) player.vx = SPEED;
    else player.vx = 0;

    if (keys['KeyW'] && player.grounded) {
        player.vy = JUMP_FORCE;
        player.grounded = false;
    }

    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;

    // Простая коллизия с полом/блоками
    player.grounded = false;
    let gridX = Math.floor((player.x + player.w/2) / TILE_SIZE);
    let gridY = Math.floor((player.y + player.h) / TILE_SIZE);

    if (world[gridX] && world[gridX][gridY] !== 0) {
        player.y = gridY * TILE_SIZE - player.h;
        player.vy = 0;
        player.grounded = true;
    }

    // Ограничения мира
    if (player.x < 0) player.x = 0;
    if (player.x > WORLD_WIDTH * TILE_SIZE - player.w) player.x = WORLD_WIDTH * TILE_SIZE - player.w;

    // Отправка позиции всем
    broadcast({
        type: 'update',
        id: peer.id,
        state: { x: player.x, y: player.y, name: player.name, clan: player.clan, color: player.color }
    });

    document.getElementById('stats').innerText = `Подключено игроков: ${connections.length + 1}`;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Рисуем мир
    for (let x = 0; x < WORLD_WIDTH; x++) {
        for (let y = 0; y < WORLD_HEIGHT; y++) {
            if (world[x][y] === 1) {
                ctx.fillStyle = '#4CAF50'; // Трава
                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            } else if (world[x][y] === 2) {
                ctx.fillStyle = '#757575'; // Камень
                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        }
    }

    // Рисуем других игроков
    for (let id in remotePlayers) {
        let p = remotePlayers[id];
        drawPlayer(p);
    }

    // Рисуем себя
    drawPlayer(player);

    requestAnimationFrame(() => {
        update();
        draw();
    });
}

function drawPlayer(p) {
    // Тело
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, player.w, player.h);
    
    // Имя и Клан
    ctx.fillStyle = "white";
    ctx.font = "12px Arial";
    ctx.textAlign = "center";
    ctx.fillText(p.name, p.x + player.w/2, p.y - 20);
    ctx.fillStyle = "#FFD700"; // Золотой цвет для клана
    ctx.fillText(`[${p.clan}]`, p.x + player.w/2, p.y - 5);
}

// Запуск
draw();

// Подстройка размера окна
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
