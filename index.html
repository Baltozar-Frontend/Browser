<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terraria Online P2P</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --t-blue: rgba(45, 50, 140, 0.9);
            --t-gold: #e7c05e;
            --t-border: #555;
            --font: 'Press Start 2P', cursive;
        }
        * { box-sizing: border-box; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: var(--font); }
        
        canvas { display: block; image-rendering: pixelated; }

        /* ИНТЕРФЕЙС TERRARIA 1:1 */
        .ui-panel {
            position: absolute; background: var(--t-blue);
            border: 3px solid var(--t-border); outline: 2px solid #000;
            color: white; padding: 10px; z-index: 100;
        }

        /* Хотбар (Инвентарь) */
        #hotbar {
            top: 10px; left: 10px; display: flex; gap: 5px;
            background: none; border: none; outline: none;
        }
        .slot {
            width: 50px; height: 50px; background: rgba(60, 60, 180, 0.6);
            border: 3px solid #333; display: flex; align-items: center;
            justify-content: center; font-size: 14px; cursor: pointer;
        }
        .slot.active { border-color: var(--t-gold); background: rgba(100, 100, 255, 0.8); }

        /* Панель игрока и онлайн */
        #online-panel { top: 10px; right: 10px; width: 280px; font-size: 8px; }
        #my-id-box { color: var(--t-gold); margin-bottom: 10px; cursor: pointer; border-bottom: 1px solid #555; padding-bottom: 5px; }
        
        /* Клан и Чат */
        #clan-panel { bottom: 20px; left: 10px; width: 320px; }
        #chat-log { 
            height: 120px; overflow-y: auto; background: rgba(0,0,0,0.3); 
            padding: 5px; font-size: 8px; margin-bottom: 10px; line-height: 1.4;
        }
        .msg-clan { color: var(--t-gold); }

        input {
            background: rgba(0,0,0,0.4); border: 2px solid var(--t-border);
            color: white; font-family: var(--font); font-size: 8px;
            padding: 8px; width: 100%; margin: 4px 0;
        }
        button {
            background: #4a4fb1; border: 2px solid var(--t-gold);
            color: white; font-family: var(--font); font-size: 8px;
            padding: 8px; width: 100%; cursor: pointer; margin-top: 5px;
        }
        button:active { background: #2d328c; }

        /* Мобильное управление */
        .joy {
            position: absolute; bottom: 30px; width: 80px; height: 80px;
            background: rgba(255,255,255,0.2); border: 3px solid #fff;
            border-radius: 50%; z-index: 200; display: none;
            align-items: center; justify-content: center; color: white;
        }
        @media (max-width: 900px) { .joy { display: flex; } }
        #btn-l { left: 30px; }
        #btn-r { left: 130px; }
        #btn-j { right: 30px; width: 100px; height: 100px; }
    </style>
</head>
<body>

<div id="hotbar">
    <div class="slot active" id="s0" onclick="setTool(0)">⛏️</div>
    <div class="slot" id="s1" onclick="setTool(1)">🧱</div>
    <div class="slot" id="s2" onclick="setTool(2)">🌳</div>
</div>

<div id="online-panel" class="ui-panel">
    <div id="my-id-box" onclick="initNetwork()">ID: Загрузка... (нажми если долго)</div>
    <input type="text" id="remote-id" placeholder="ID друга">
    <button onclick="connectToPeer()">🔗 ПОДКЛЮЧИТЬСЯ</button>
    <div style="margin-top:10px;">
        КЛАН: <input type="text" id="clan-name" value="Terrarians" onchange="updateClan()">
    </div>
</div>

<div id="clan-panel" class="ui-panel">
    <div id="chat-log"></div>
    <input type="text" id="chat-input" placeholder="Сообщение клану..." onkeydown="if(event.key==='Enter') sendChat()">
</div>

<div id="btn-l" class="joy" ontouchstart="keys.KeyA=true" ontouchend="keys.KeyA=false">◀</div>
<div id="btn-r" class="joy" ontouchstart="keys.KeyD=true" ontouchend="keys.KeyD=false">▶</div>
<div id="btn-j" class="joy" ontouchstart="keys.KeyW=true" ontouchend="keys.KeyW=false">JUMP</div>

<canvas id="game"></canvas>

<script>
/** КОНСТАНТЫ **/
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TILE = 32;
const MAP_SIZE = 64;
let world = [];
let camera = { x: 0, y: 0 };
let keys = {};

/** ИГРОК **/
let me = {
    x: 500, y: 300, vx: 0, vy: 0,
    w: 20, h: 42, grounded: false,
    name: "Игрок" + Math.floor(Math.random()*99),
    clan: "Terrarians",
    tool: 0
};
let players = {};

/** СЕТЬ (ОНЛАЙН) **/
let peer = null;
let conns = [];

function initNetwork() {
    if(peer) peer.destroy();
    document.getElementById('my-id-box').innerText = "Генерация ID...";
    
    peer = new Peer();
    
    peer.on('open', id => {
        document.getElementById('my-id-box').innerText = "ВАШ ID: " + id;
        console.log("My ID:", id);
    });

    peer.on('connection', conn => {
        setupConn(conn);
    });

    peer.on('error', err => {
        console.error(err);
        document.getElementById('my-id-box').innerText = "ОШИБКА СЕТИ (Нажми)";
    });
}

function connectToPeer() {
    const rid = document.getElementById('remote-id').value;
    if(!rid) return;
    const conn = peer.connect(rid);
    setupConn(conn);
}

function setupConn(conn) {
    conn.on('open', () => {
        conns.push(conn);
        addMsg("СИСТЕМА", "Игрок подключен!");
        conn.send({ type: 'sync_world', world: world });
    });
    conn.on('data', data => {
        if(data.type === 'sync_world') world = data.world;
        if(data.type === 'pos') players[data.id] = data.data;
        if(data.type === 'block') world[data.x][data.y] = data.v;
        if(data.type === 'chat' && data.clan === me.clan) {
            addMsg(data.name, data.txt, true);
        }
    });
}

function broadcast(obj) {
    conns.forEach(c => c.send(obj));
}

/** МИР **/
function genWorld() {
    for(let x=0; x<MAP_SIZE; x++) {
        world[x] = [];
        for(let y=0; y<MAP_SIZE; y++) {
            let type = 0;
            if(y > 20) type = 1; // трава
            if(y > 25) type = 2; // камень
            world[x][y] = type;
        }
    }
}

/** ЛОГИКА **/
window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

function updateClan() {
    me.clan = document.getElementById('clan-name').value;
    addMsg("СИСТЕМА", "Вы вошли в клан " + me.clan);
}

function sendChat() {
    const inp = document.getElementById('chat-input');
    if(!inp.value) return;
    broadcast({ type: 'chat', clan: me.clan, name: me.name, txt: inp.value });
    addMsg(me.name, inp.value, true);
    inp.value = "";
}

function addMsg(name, txt, isClan = false) {
    const log = document.getElementById('chat-log');
    log.innerHTML += `<div class="${isClan?'msg-clan':''}">[${name}]: ${txt}</div>`;
    log.scrollTop = log.scrollHeight;
}

function setTool(id) {
    me.tool = id;
    document.querySelectorAll('.slot').forEach((s, i) => s.classList.toggle('active', i === id));
}

function loop() {
    // Движение
    if(keys.KeyA) me.vx = -4;
    else if(keys.KeyD) me.vx = 4;
    else me.vx *= 0.8;

    if(keys.KeyW && me.grounded) { me.vy = -10; me.grounded = false; }
    
    me.vy += 0.5; // гравитация
    me.x += me.vx;
    me.y += me.vy;

    // Коллизии
    let tx = Math.floor((me.x + me.w/2) / TILE);
    let ty = Math.floor((me.y + me.h) / TILE);
    if(world[tx] && world[tx][ty] > 0) {
        me.y = ty * TILE - me.h;
        me.vy = 0;
        me.grounded = true;
    } else {
        me.grounded = false;
    }

    // Камера
    camera.x += (me.x - canvas.width/2 - camera.x) * 0.1;
    camera.y += (me.y - canvas.height/2 - camera.y) * 0.1;

    // Сетевая синхронизация
    if(peer && peer.id) {
        broadcast({ type: 'pos', id: peer.id, data: { x: me.x, y: me.y, clan: me.clan, name: me.name } });
    }

    draw();
    requestAnimationFrame(loop);
}

function draw() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.clearRect(0,0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // Рисуем блоки
    for(let x=0; x<MAP_SIZE; x++) {
        for(let y=0; y<MAP_SIZE; y++) {
            if(world[x][y] === 0) continue;
            ctx.fillStyle = world[x][y] === 1 ? '#3a9d23' : '#757575';
            ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.strokeRect(x*TILE, y*TILE, TILE, TILE);
        }
    }

    // Другие игроки
    for(let id in players) {
        let p = players[id];
        ctx.fillStyle = "#e57373";
        ctx.fillRect(p.x, p.y, me.w, me.h);
        ctx.fillStyle = "white";
        ctx.font = "8px 'Press Start 2P'";
        ctx.fillText(p.name, p.x - 10, p.y - 20);
        ctx.fillStyle = "gold";
        ctx.fillText(`<${p.clan}>`, p.x - 10, p.y - 8);
    }

    // Я
    ctx.fillStyle = "#4fc3f7";
    ctx.fillRect(me.x, me.y, me.w, me.h);
    ctx.strokeStyle = "white";
    ctx.strokeRect(me.x, me.y, me.w, me.h);

    ctx.restore();
}

// Взаимодействие (Клик)
canvas.onmousedown = e => {
    let rx = Math.floor((e.clientX + camera.x) / TILE);
    let ry = Math.floor((e.clientY + camera.y) / TILE);
    if(rx < 0 || ry < 0 || rx >= MAP_SIZE || ry >= MAP_SIZE) return;

    let val = me.tool === 0 ? 0 : 2;
    world[rx][ry] = val;
    broadcast({ type: 'block', x: rx, y: ry, v: val });
};

// СТАРТ
genWorld();
initNetwork();
loop();
</script>
</body>
</html>
