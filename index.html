<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash Game Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        .balance-card { background: #334155; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; border: 1px solid #475569; }
        .balance-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 28px; font-weight: bold; color: #38bdf8; margin-top: 5px; }

        .display-area { background: #090d16; height: 160px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 15px; border: 1px solid #1e293b; }
        .multiplier { font-size: 48px; font-weight: 900; color: #f8fafc; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .status { font-size: 14px; margin-top: 8px; font-weight: bold; }
        .status.crashed { color: #ef4444; }
        .status.running { color: #22c55e; }
        .status.waiting { color: #94a3b8; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; outline: none; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.2s; margin-bottom: 8px; }
        .btn-main { background: #0284c7; color: white; }
        .btn-main:hover { background: #0369a1; }
        .btn-cashout { background: #16a34a; color: white; }
        .btn-cashout:hover { background: #15803d; }
        .btn-donate { background: #f97316; color: white; }
        .btn-donate:hover { background: #ea580c; }
        .btn-reward { background: #8b5cf6; color: white; }
        .btn-reward:hover { background: #7c3aed; }
        .btn-secondary { background: #334155; color: #38bdf8; border: 1px solid #0284c7; }

        .row { display: flex; gap: 8px; }
        .row input { flex: 1; }
        .row button { width: auto; padding: 0 15px; margin-bottom: 0; }
        
        .daily-box { background: #1e1b4b; border: 1px solid #4338ca; padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
        .daily-title { font-size: 12px; color: #a5b4fc; font-weight: bold; margin-bottom: 4px; }
        .daily-streak { font-size: 11px; color: #cbd5e1; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="balance-card">
        <div class="balance-title">Ваш Баланс</div>
        <div class="balance-value" id="balanceDisplay">100.00 ₽</div>
    </div>

    <!-- Ежедневные подарки -->
    <div class="daily-box">
        <div class="daily-title">🎁 Ежедневный подарок</div>
        <div class="daily-streak" id="streakInfo">Загрузка...</div>
        <button class="btn btn-reward" id="rewardBtn" onclick="claimDailyReward()">Забрать подарок</button>
    </div>

    <!-- Поле игры -->
    <div class="display-area">
        <div class="multiplier" id="multDisplay">1.00x</div>
        <div class="status waiting" id="statusDisplay">Сделайте ставку</div>
    </div>

    <div class="input-group">
        <label>Сумма ставки (₽)</label>
        <input type="number" id="betAmount" value="10" min="1">
    </div>

    <button class="btn btn-main" id="actionBtn" onclick="handleAction()">Сделать ставку</button>
    <button class="btn btn-donate" onclick="openDonatePage()">💳 Пополнить через DonationAlerts</button>

    <div class="input-group" style="margin-top: 15px;">
        <label>Промокод</label>
        <div class="row">
            <input type="text" id="promoInput" placeholder="Введите код">
            <button class="btn btn-secondary" onclick="applyPromo()">ОК</button>
        </div>
    </div>
</div>

<script>
    // ===== ВСТАВЬТЕ СЮДА ССЫЛКУ НА ВАШ DONATIONALERTS =====
    const DONATION_ALERTS_URL = 'https://www.donationalerts.com/r/YOUR_USERNAME';

    // Встроенные промокоды
    const PROMO_CODES = {
        'START100': 100,
        'SECRET500': 500,
        'VIP1000': 1000,
        'VIBECODER': 2500
    };

    // Награды по дням серии
    const DAILY_REWARDS = [50, 100, 200, 350, 500, 750, 1000];

    // Состояние из памяти браузера
    let balance = parseFloat(localStorage.getItem('crash_balance')) || 100.00;
    let streak = parseInt(localStorage.getItem('crash_streak')) || 0;
    let lastClaimTime = parseInt(localStorage.getItem('crash_last_claim')) || 0;

    let gameState = 'IDLE'; 
    let currentMult = 1.00;
    let crashPoint = 1.00;
    let gameInterval = null;
    let speed = 50; 
    let betValue = 0;

    function updateBalanceUI() {
        document.getElementById('balanceDisplay').innerText = balance.toFixed(2) + ' ₽';
        localStorage.setItem('crash_balance', balance.toString());
    }

    function updateDailyRewardUI() {
        const now = Date.now();
        const oneDay = 24 * 60 * 60 * 1000;
        const rewardBtn = document.getElementById('rewardBtn');
        const streakInfo = document.getElementById('streakInfo');

        const rewardIndex = Math.min(streak, DAILY_REWARDS.length - 1);
        const nextReward = DAILY_REWARDS[rewardIndex];

        if (now - lastClaimTime >= oneDay) {
            // Если пропустил более 48 часов, сбрасываем серию
            if (now - lastClaimTime >= oneDay * 2) {
                streak = 0;
                localStorage.setItem('crash_streak', '0');
            }
            rewardBtn.disabled = false;
            rewardBtn.innerText = `Забрать ${nextReward} ₽ (День ${streak + 1})`;
            streakInfo.innerText = `Серия: ${streak} дн. Доступен бонус: ${nextReward} ₽`;
        } else {
            rewardBtn.disabled = true;
            const hoursLeft = Math.ceil((oneDay - (now - lastClaimTime)) / (1000 * 60 * 60));
            rewardBtn.innerText = `Забрано (Осталось ${hoursLeft} ч.)`;
            streakInfo.innerText = `Серия: ${streak} дн. Завтра бонус: ${DAILY_REWARDS[Math.min(streak, DAILY_REWARDS.length - 1)]} ₽`;
        }
    }

    function claimDailyReward() {
        const now = Date.now();
        const rewardIndex = Math.min(streak, DAILY_REWARDS.length - 1);
        const reward = DAILY_REWARDS[rewardIndex];

        balance += reward;
        streak += 1;
        lastClaimTime = now;

        localStorage.setItem('crash_streak', streak.toString());
        localStorage.setItem('crash_last_claim', lastClaimTime.toString());

        updateBalanceUI();
        updateDailyRewardUI();
        alert(`🎉 Зачислено: ${reward} ₽! Заходите завтра.`);
    }

    function handleAction() {
        const btn = document.getElementById('actionBtn');
        const status = document.getElementById('statusDisplay');

        if (gameState === 'IDLE') {
            betValue = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(betValue) || betValue <= 0) {
                alert('Введите корректную сумму ставки');
                return;
            }
            if (betValue > balance) {
                alert('Недостаточно средств на балансе');
                return;
            }

            balance -= betValue;
            updateBalanceUI();

            const e = 2 ** 32;
            const h = crypto.getRandomValues(new Uint32Array(1))[0];
            crashPoint = Math.max(1.01, Math.floor((100 * e - h) / (e - h)) / 100);
            
            gameState = 'RUNNING';
            currentMult = 1.00;
            speed = 50;
            
            btn.innerText = 'Забрать выигрыш';
            btn.className = 'btn btn-cashout';
            status.innerText = 'В игре...';
            status.className = 'status running';

            startGameLoop();

        } else if (gameState === 'RUNNING') {
            clearInterval(gameInterval);
            const winAmount = betValue * currentMult;
            balance += winAmount;
            updateBalanceUI();

            status.innerText = `Вы выиграли ${winAmount.toFixed(2)} ₽!`;
            status.className = 'status running';
            resetGameUI();
        }
    }

    function startGameLoop() {
        gameInterval = setInterval(() => {
            currentMult += 0.01;
            
            if (currentMult > 2.0) speed = 30;
            if (currentMult > 5.0) speed = 15;
            if (currentMult > 10.0) speed = 5;

            document.getElementById('multDisplay').innerText = currentMult.toFixed(2) + 'x';

            if (currentMult >= crashPoint) {
                clearInterval(gameInterval);
                gameState = 'CRASHED';
                
                const status = document.getElementById('statusDisplay');
                status.innerText = `КРАШ на ${crashPoint.toFixed(2)}x!`;
                status.className = 'status crashed';
                
                resetGameUI();
            }
        }, speed);
    }

    function resetGameUI() {
        const btn = document.getElementById('actionBtn');
        btn.innerText = 'Сделать ставку';
        btn.className = 'btn btn-main';
        gameState = 'IDLE';
    }

    function applyPromo() {
        const input = document.getElementById('promoInput');
        const code = input.value.trim().toUpperCase();

        let usedPromos = JSON.parse(localStorage.getItem('crash_used_promos') || '[]');

        if (usedPromos.includes(code)) {
            alert('Вы уже активировали этот промокод!');
            return;
        }

        if (PROMO_CODES[code]) {
            const reward = PROMO_CODES[code];
            balance += reward;
            usedPromos.push(code);
            localStorage.setItem('crash_used_promos', JSON.stringify(usedPromos));
            
            updateBalanceUI();
            alert(`✅ Промокод активирован! Зачислено: ${reward} ₽`);
            input.value = '';
        } else {
            alert('❌ Неверный промокод');
        }
    }

    function openDonatePage() {
        window.open(DONATION_ALERTS_URL, '_blank');
    }

    updateBalanceUI();
    updateDailyRewardUI();
</script>
</body>
</html>
