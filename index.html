<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARKNET // SECURE NODE v4.02</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050505;
            color: #00ff66;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Анимация заднего фона (Матрица) */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.25;
        }

        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 15, 10, 0.9);
            border: 1px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2), inset 0 0 15px rgba(0, 255, 102, 0.1);
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00ff66;
        }

        .status {
            font-size: 0.8rem;
            color: #ff3333;
            margin-bottom: 25px;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            font-size: 1rem;
            outline: none;
            border-radius: 4px;
        }

        input:focus {
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #00ff66;
            color: #000;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            border-radius: 4px;
        }

        button:hover {
            background: #00cc52;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
        }

        /* Контейнер пранка */
        #prank-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #loading-text {
            font-size: 1.2rem;
            color: #00ff66;
            margin-bottom: 15px;
        }

        .prank-title {
            font-size: 3rem;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055;
            margin-bottom: 20px;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .prank-desc {
            font-size: 1.3rem;
            color: #fff;
            max-width: 600px;
            line-height: 1.5;
        }

        .meme {
            font-size: 5rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="login-card" id="login-form">
        <h1>[ ONION ROUTE ]</h1>
        <div class="status">● СОЕДИНЕНИЕ НЕЗАЩИЩЕНО // ТРЕБУЕТСЯ АВТОРИЗАЦИЯ</div>
        
        <form onsubmit="startHack(event)">
            <div class="input-group">
                <label>СЕКРЕТНЫЙ ПОЗЫВНОЙ:</label>
                <input type="text" placeholder="например: Anonymous_99" required>
            </div>
            
            <div class="input-group">
                <label>ПАРОЛЬ ОТ ГОСУСЛУГ ИЛИ КАРТЫ:</label>
                <input type="password" placeholder="••••••••••••" required>
            </div>

            <div class="input-group">
                <label>СКОЛЬКО БИТКОИНОВ НА СЧЕТУ?</label>
                <input type="number" placeholder="0" required>
            </div>

            <button type="submit">ВОЙТИ В ДАРКНЕТ</button>
        </form>
    </div>

    <!-- Окно пранка -->
    <div id="prank-screen">
        <div id="loading-box">
            <div id="loading-text">Взлом базы данных ФСБ... [0%]</div>
        </div>
        
        <div id="prank-content" style="display: none;">
            <div class="prank-title">🚨 ТЫ ПОПАЛСЯ! 🚨</div>
            <div class="prank-desc">
                Вход в Даркнет успешно выполнен!<br><br>
                Ваш IP-адрес передан в секретную службу по поеданию чипсов.<br>
                <strong>Наказание:</strong> ты должен купить мне газировку.
            </div>
            <div class="meme">🤡🕶️🍕</div>
        </div>
    </div>

    <script>
        // Анимация Матрицы
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Логика розыгрыша
        function startHack(e) {
            e.preventDefault();
            
            const prankScreen = document.getElementById('prank-screen');
            const loadingText = document.getElementById('loading-text');
            const prankContent = document.getElementById('prank-content');
            
            prankScreen.style.display = 'flex';

            let progress = 0;
            const steps = [
                "Сканирование сетчатки через веб-камеру...",
                "Слив пароля от Wi-Fi...",
                "Отправка геолокации в Пентагон...",
                "Загрузка вируса 'Удаление Доты'...",
                "ПОЧТИ ГОТОВО..."
            ];

            let stepIdx = 0;

            const interval = setInterval(() => {
                progress += 20;
                if (stepIdx < steps.length) {
                    loadingText.innerText = `${steps[stepIdx]} [${progress}%]`;
                    stepIdx++;
                }

                if (progress >= 100) {
                    clearInterval(interval);
                    document.getElementById('loading-box').style.display = 'none';
                    prankContent.style.display = 'block';
                }
            }, 800);
        }
    </script>
</body>
</html>
