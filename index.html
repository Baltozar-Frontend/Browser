<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terraria P2P Online</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --t-blue: rgba(43, 43, 137, 0.9);
            --t-border: #7d7d7d;
            --t-gold: #e7c05e;
            --t-font: 'Press Start 2P', cursive;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: var(--t-font); }
        canvas { display: block; image-rendering: pixelated; }

        /* ИНТЕРФЕЙС TERRARIA */
        .terraria-panel {
            background: var(--t-blue);
            border: 4px solid var(--t-border);
            border-image: ridge;
            box-shadow: inset 0 0 10px #000;
            color: white;
            padding: 10px;
            position: absolute;
            z-index: 100;
        }

        /* ХОТБАР (ВЕРХ СЛЕВА) */
        #hotbar {
            top: 10px; left: 10px; display: flex; gap: 4px; border: none; background: none; box-shadow: none;
        }
        .slot {
            width: 46px; height: 46px;
            background: rgba(60, 60, 160, 0.7);
            border: 3px solid #333;
            display: flex; justify-content: center; align-items: center;
            font-size: 10px; cursor: pointer;
        }
        .slot.active { border-color: var(--t-gold); background: rgba(100, 100, 250, 0.8); }

        /* МЕНЮ ПЕРСОНАЖА (ВЕРХ СПРАВА) */
        #stats-panel { top: 10px; right: 10px; width: 220px; font-size: 8px; line-height: 1.5; }
        .clan-tag { color: var(--t-gold); text-shadow: 1px 1px #000; }

        /* КЛАН И ЧАТ (СНИЗУ СЛЕВА) */
        #clan-panel { bottom: 20px; left: 10px; width: 300px; max-height: 200px; display: flex; flex-direction: column; }
        #chat-area { height: 100px; overflow-y: auto; margin-bottom: 5px; font-size: 7px; background: rgba(0,0,0,0.3); padding: 5px; }
        .msg { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); }

        input {
            background: rgba(0,0,0,0.5); border: 2px solid var(--t-border); color: white;
            font-family: var(--t-font); font-size: 8px; padding: 5px; width: 100%; box-sizing: border-box;
        }
        button {
            background: #5050b4; border: 2px solid var(--t-gold); color: white;
            font-family: var(--t-font); font-size: 8px; padding: 5px; cursor: pointer; margin-top: 5px;
        }

        /* МОБИЛЬНОЕ УПРАВЛЕНИЕ */
        .mobile-btn {
            position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.2);
            border-radius: 50%; border: 2px solid white; z-index: 200; display: none;
            justify-content: center; align-items: center; color: white; font-size: 20px;
        }
        @media (max-width: 900px) { .mobile-btn { display: flex; } }
        #btn-left { bottom: 40px; left: 20px; }
        #btn-right { bottom: 40px; left: 100px; }
        #btn-jump { bottom: 40px; right: 40px; width: 80px; height: 80px; }
    </style>
</head>
<body>

<!-- Хотбар -->
<div id="hotbar" class="terraria-panel">
    <div class="slot active" onclick="setTool(0)">⛏️</div>
    <div class="slot" onclick="setTool(1)">🧱</div>
    <div class="slot" onclick="setTool(2)">🗡️</div>
</div>

<!-- Статус и ID -->
<div id="stats-panel" class="terraria-panel">
    <div id="my-id">ID: Загрузка...</div>
    <div id="clan-info">Клан: <span class="clan-tag" id="cur-clan">Нет</span></div>
    <input type="text" id="join-id" placeholder="ID друга">
    <button onclick="connectToFriend()">Присоединиться</button>
</div>

<!-- Клан Панель -->
<div id="clan-panel" class="terraria-panel">
    <div style="font-size: 8px; margin-bottom: 5px; color: var(--t-gold);">КЛАНОВЫЙ ЧАТ</div>
    <div id="chat-area"></div>
    <input type="text" id="clan-name-input" placeholder="Название клана" onchange="changeClan()" value="Terrarians">
    <input type="text" id="chat-input" placeholder="Сообщение в клан..." onkeydown="if(event.key==='Enter') sendClanMsg()">
</div>

<!-- Мобильные кнопки -->
<div id="btn-left" class="mobile-btn" ontouchstart="move(1)" ontouchend="move(0)">◀</div>
<div id="btn-right" class="mobile-btn" ontouchstart="move(2)" ontouchend="move(0)">▶</div>
<div id="btn-jump" class="mobile-btn" ontouchstart="move(3)" ontouchend="move(4)">JUMP</div>

<canvas id="game"></canvas>

<script>
/** НАСТРОЙКИ МИРА **/
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TILE_SIZE = 32;
const CHUNK_SIZE = 50;
let world = [];
let camera = { x: 0, y: 0 };

/** ИГРОК **/
let me = {
    x: 200, y: 200, vx: 0, vy: 0, 
    name: "Player" + Math.floor(Math.random()*100),
    clan: "Terrarians",
    tool: 0, // 0 - кирка, 1 - блок
    w: 20, h: 40
};
let players = {}; // Другие игроки

/** СЕТЬ **/
let peer, conn;
let connections = [];

function initPeer() {
    peer = new Peer();
    peer.on('open', id => {
        document.getElementById('my-id').innerText = "Ваш ID: " + id;
        console.log("Peer ID:", id);
    });
    peer.on('error', err => {
        alert("Ошибка сети: " + err.type);
    });
    peer.on('connection', c => setupConn(c));
}

function setupConn(c) {
    c.on('open', () => {
        connections.push(c);
        c.send({ type: 'world', data: world });
    });
    c.on('data', data => {
        if(data.type === 'world') world = data.data;
        if(data.type === 'move') players[data.id] = data.state;
        if(data.type === 'block') world[data.x][data.y] = data.val;
        if(data.type === 'chat' && data.clan === me.clan) {
            addChatMessage(data.name, data.text);
        }
    });
}

function connectToFriend() {
    const id = document.getElementById('join-id').value;
    if(!id) return;
    const c = peer.connect(id);
    setupConn(c);
}

/** ГЕНЕРАЦИЯ МИРА **/
for(let x=0; x<CHUNK_SIZE; x++) {
    world[x] = [];
    for(let y=0; y<CHUNK_SIZE; y++) {
        world[x][y] = y > 15 ? (y > 20 ? 2 : 1) : 0; // 1-трава, 2-камень
    }
}

/** ЛОГИКА ИГРЫ **/
const keys = {};
window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

function changeClan() {
    me.clan = document.getElementById('clan-name-input').value;
    document.getElementById('cur-clan').innerText = me.clan;
    addChatMessage("СИСТЕМА", "Вы вошли в клан " + me.clan);
}

function sendClanMsg() {
    const input = document.getElementById('chat-input');
    if(!input.value) return;
    const msg = { type: 'chat', clan: me.clan, name: me.name, text: input.value };
    connections.forEach(c => c.send(msg));
    addChatMessage(me.name, input.value);
    input.value = "";
}

function addChatMessage(name, text) {
    const area = document.getElementById('chat-area');
    area.innerHTML += `<div class="msg"><span class="clan-tag">[${name}]:</span> ${text}</div>`;
    area.scrollTop = area.scrollHeight;
}

function setTool(id) {
    me.tool = id;
    document.querySelectorAll('.slot').forEach((s, i) => s.classList.toggle('active', i === id));
}

// Мобильное движение
let mDir = 0;
function move(dir) {
    if(dir === 1) keys['KeyA'] = true;
    if(dir === 2) keys['KeyD'] = true;
    if(dir === 3) keys['KeyW'] = true;
    if(dir === 0) { keys['KeyA'] = false; keys['KeyD'] = false; }
    if(dir === 4) keys['KeyW'] = false;
}

function update() {
    // Физика
    if (keys['KeyA']) me.vx = -4;
    else if (keys['KeyD']) me.vx = 4;
    else me.vx *= 0.8;

    if (keys['KeyW'] && me.grounded) {
        me.vy = -10;
        me.grounded = false;
    }

    me.vy += 0.5; // гравитация
    me.x += me.vx;
    me.y += me.vy;

    // Коллизии (упрощенно)
    let gx = Math.floor((me.x + me.w/2) / TILE_SIZE);
    let gy = Math.floor((me.y + me.h) / TILE_SIZE);
    if(world[gx] && world[gx][gy] > 0) {
        me.y = gy * TILE_SIZE - me.h;
        me.vy = 0;
        me.grounded = true;
    } else {
        me.grounded = false;
    }

    // Камера
    camera.x += (me.x - canvas.width/2 - camera.x) * 0.1;
    camera.y += (me.y - canvas.height/2 - camera.y) * 0.1;

    // Синхронизация
    const state = { x: me.x, y: me.y, name: me.name, clan: me.clan, tool: me.tool };
    connections.forEach(c => c.send({ type: 'move', id: peer.id, state }));
}

function draw() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.clearRect(0,0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // Мир
    for(let x=0; x<CHUNK_SIZE; x++) {
        for(let y=0; y<CHUNK_SIZE; y++) {
            if(world[x][y] === 0) continue;
            ctx.fillStyle = world[x][y] === 1 ? '#3a9d23' : '#777';
            ctx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.strokeRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
    }

    // Другие игроки
    for(let id in players) {
        let p = players[id];
        ctx.fillStyle = "#e57373";
        ctx.fillRect(p.x, p.y, me.w, me.h);
        ctx.fillStyle = "white";
        ctx.font = "6px 'Press Start 2P'";
        ctx.fillText(p.name, p.x, p.y - 15);
        ctx.fillStyle = "#ffd700";
        ctx.fillText(`<${p.clan}>`, p.x, p.y - 5);
    }

    // Я
    ctx.fillStyle = "#4fc3f7";
    ctx.fillRect(me.x, me.y, me.w, me.h);

    ctx.restore();
    update();
    requestAnimationFrame(draw);
}

// Взаимодействие с миром
canvas.onmousedown = e => {
    const rx = Math.floor((e.clientX + camera.x) / TILE_SIZE);
    const ry = Math.floor((e.clientY + camera.y) / TILE_SIZE);
    if(rx < 0 || ry < 0 || rx >= CHUNK_SIZE || ry >= CHUNK_SIZE) return;

    let val = me.tool === 0 ? 0 : 2; // 0 - копать, 2 - строить камень
    world[rx][ry] = val;
    connections.forEach(c => c.send({ type: 'block', x: rx, y: ry, val: val }));
};

// Запуск
initPeer();
draw();
changeClan();
</script>
</body>
</html>
