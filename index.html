<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMail | Рабочая почта</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --bg-color: #f3f4f6; --sidebar-bg: #1f2937; --sidebar-text: #e5e7eb; --primary: #3b82f6; --text-dark: #111827; --text-light: #6b7280; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background-color: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 20px 0; }
        .logo { font-size: 24px; font-weight: bold; padding: 0 20px 20px 20px; color: var(--white); border-bottom: 1px solid #374151; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .compose-btn { background-color: var(--primary); color: white; border: none; padding: 12px; margin: 0 20px 20px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .compose-btn:hover { background-color: #2563eb; }
        .menu-item { padding: 15px 20px; cursor: pointer; transition: background 0.2s; display: flex; justify-content: space-between; }
        .menu-item:hover, .menu-item.active { background-color: #374151; border-left: 4px solid var(--primary); }
        .email-list { width: 350px; background-color: var(--white); border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; }
        .list-header { padding: 20px; border-bottom: 1px solid #e5e7eb; font-size: 18px; font-weight: bold; color: var(--text-dark); }
        .email-item { padding: 15px 20px; border-bottom: 1px solid #e5e7eb; cursor: pointer; transition: background 0.2s; }
        .email-item:hover { background-color: #f9fafb; }
        .email-sender { font-weight: bold; color: var(--text-dark); margin-bottom: 5px; }
        .email-subject { font-size: 14px; color: var(--text-dark); margin-bottom: 5px; }
        .email-preview { font-size: 13px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .main-content { flex: 1; background-color: var(--bg-color); padding: 30px; display: flex; flex-direction: column; }
        .view-pane, .compose-pane { background-color: var(--white); border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); height: 100%; display: none; }
        .view-pane.active, .compose-pane.active { display: flex; flex-direction: column; }
        .view-header { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #e5e7eb; }
        .view-subject { font-size: 24px; margin-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 6px; outline: none; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
        .form-group textarea { height: 300px; resize: none; }
        .send-btn { background-color: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; align-self: flex-start; }
        .send-btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">⚡ VibeMail</div>
        <button class="compose-btn" onclick="showPane('compose')">Написать письмо</button>
        <div class="menu-item active" onclick="showPane('view')"><span>Входящие</span></div>
        <div class="menu-item"><span>Маркетинг</span><span style="background: #3b82f6; padding: 2px 8px; border-radius: 12px; font-size: 12px;">Active</span></div>
    </div>

    <div class="email-list">
        <div class="list-header">Статус системы</div>
        <div class="email-item" onclick="openEmail('Интеграция завершена!', 'VibeMail Bot', 'EmailJS успешно подключен. Теперь ты можешь отправлять настоящие письма прямо из этого интерфейса.')">
            <div class="email-sender">VibeMail Bot</div>
            <div class="email-subject">Интеграция завершена!</div>
            <div class="email-preview">EmailJS успешно подключен. Теперь ты...</div>
        </div>
    </div>

    <div class="main-content">
        <div class="view-pane active" id="viewPane">
            <div class="view-header">
                <h2 class="view-subject" id="viewSubject">Система готова</h2>
                <div style="color: #6b7280;" id="viewSender">От: VibeMail Bot</div>
            </div>
            <div class="view-body" id="viewBody" style="line-height: 1.6; color: #374151;">
                Нажми кнопку «Написать письмо», укажи любой Email и проверь отправку в реальном времени!
            </div>
        </div>

        <div class="compose-pane" id="composePane">
            <h2 style="margin-bottom: 20px;">Новое сообщение</h2>
            <div class="form-group">
                <input type="email" placeholder="Кому (настоящий email)" id="toInput">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Тема письма" id="subjInput">
            </div>
            <div class="form-group">
                <textarea id="msgInput" placeholder="Введите текст сообщения..."></textarea>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendEmail()">Отправить письмо</button>
            <div id="statusText" style="margin-top: 15px; font-size: 14px; font-weight: bold;"></div>
        </div>
    </div>

    <script>
        // Инициализация EmailJS с твоим Public Key
        (function() {
            emailjs.init("mH83HaOIxhkTHMDil"); 
        })();

        function showPane(paneName) {
            document.getElementById('viewPane').classList.remove('active');
            document.getElementById('composePane').classList.remove('active');
            
            if(paneName === 'compose') {
                document.getElementById('composePane').classList.add('active');
            } else {
                document.getElementById('viewPane').classList.add('active');
            }
        }

        function openEmail(subject, sender, body) {
            showPane('view');
            document.getElementById('viewSubject').innerText = subject;
            document.getElementById('viewSender').innerText = 'От: ' + sender;
            document.getElementById('viewBody').innerText = body;
        }

        // Логика отправки
        function sendEmail() {
            const to = document.getElementById('toInput').value;
            const subj = document.getElementById('subjInput').value;
            const msg = document.getElementById('msgInput').value;
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('statusText');

            if(!to || !msg) {
                status.style.color = 'red';
                status.innerText = 'Укажите получателя и текст письма!';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Отправка...';
            status.innerText = '';

            const serviceID = 'service_yhbd8cw';
            const templateID = 'template_6zgp5kl';

            const templateParams = {
                to_email: to,
                subject: subj,
                message: msg
            };

            emailjs.send(serviceID, templateID, templateParams)
                .then(function(response) {
                    status.style.color = 'green';
                    status.innerText = 'Письмо успешно доставлено!';
                    
                    document.getElementById('toInput').value = '';
                    document.getElementById('subjInput').value = '';
                    document.getElementById('msgInput').value = '';
                    
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerText = 'Отправить письмо';
                        status.innerText = '';
                        showPane('view');
                    }, 2500);

                }, function(error) {
                    status.style.color = 'red';
                    status.innerText = 'Ошибка при отправке: ' + error.text;
                    btn.disabled = false;
                    btn.innerText = 'Отправить письмо';
                });
        }
    </script>
</body>
</html>
